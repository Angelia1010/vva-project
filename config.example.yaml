# 复制为 config.yaml 后修改。未写的项使用默认值（见 vva/core/config.py）。
# 支持 ${环境变量} 和 ${环境变量:-默认值}。

# ---------------------------------------------------------------- 视频接入
video:
  # local  电脑摄像头（本地测试）
  # stream RTSP / HTTP / 视频文件
  # push   外部程序通过 POST /api/ingest/frame 推送 JPEG
  # custom 自定义引擎插件（继承 vva.video.base.VideoSource）
  type: local
  source_id: cam0

  local:
    index: 0            # 摄像头编号，可用 python main.py --probe-cameras 查看
    width: 1280
    height: 720
    fps: 15
    backend: null       # Windows 打开慢可设为 dshow；macOS: avfoundation；Linux: v4l2

  stream:
    url: "rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101"
    rtsp_transport: tcp
    loop: false         # url 为本地视频文件时，是否循环播放

  custom:
    class: "examples/custom_video_source.py:TestPatternSource"
    params: {}

  buffer:
    seconds: 60         # 帧缓存时长，决定能“回看”多久
    fps: 2              # 缓存抽帧频率
    jpeg_quality: 85
    max_side: 1920

# ---------------------------------------------------------------- 音频接入
audio:
  enabled: true
  input:
    type: local         # local 电脑麦克风 | push 外部 WebSocket 推流 | custom 自定义
    sample_rate: 16000
    device: null        # 设备编号或名称，python main.py --list-devices 查看
  output:
    type: local         # local 电脑扬声器 | push 通过 WebSocket 发给外部 | none | custom
    device: null

vad:
  threshold_db: -40     # 低于该音量不算人声；环境较吵可调高到 -35 左右
  start_frames: 6       # 最近 300ms（10 帧）内至少几帧是人声才算开始说话，挡住敲键盘等短促声音
  min_utterance_ms: 500 # 一句话里人声至少多长
  min_voiced_ratio: 0.5 # 一句话里人声帧至少占多少
  min_band_ratio: 0.6   # 人声频带能量占比下限（0 表示不检查）；误把说话当噪声时调低到 0.5
  end_silence_ms: 700   # 停顿多久算说完
  max_utterance_s: 15
  webrtc_mode: 2        # 装了 webrtcvad-wheels 时生效，0~3，越大越严格
  debug: false          # true：日志里每 2 秒打印音量和检查结果，说话没反应时用来排查

voice:
  # 收音模式：always 一直在听 | wake_word 要说唤醒词 | push_to_talk 按住说话（网页按钮或空格键）
  mode: always
  # 用电脑外放测试时，扬声器的声音会被麦克风收进去，建议保持 true（播放时不收音）。
  # 戴耳机或使用带回声消除的设备时可设为 false，此时支持“说话即打断”。
  mute_mic_while_speaking: true
  barge_in: true
  wake_words: []        # mode=wake_word 时使用，例如 ["小监"]
  wake_timeout: 30      # 唤醒后多少秒内不用再说唤醒词
  min_chars: 2          # 识别结果少于几个字就丢弃（语气词、“谢谢观看”等常见误识别也会丢弃）

# ---------------------------------------------------------------- 模型（OpenAI 兼容接口）
# asr / tts / agent_llm 未填写 base_url、api_key 时自动沿用 vlm 的配置；
# agent_llm 未填写 model 时沿用 vlm 的 model（用同一个多模态模型当大脑）。
models:
  # 可选：知识库向量检索（OpenAI 兼容 /v1/embeddings）。不填 model 则只用关键词检索
  # embedding:
  #   base_url: "http://127.0.0.1:8004/v1"
  #   model: "qwen3-embedding"
  vlm:
    base_url: "http://127.0.0.1:8001/v1"
    api_key: "${VLM_API_KEY:-EMPTY}"
    model: "your-vl-model"
    max_image_side: 1280
    # 定位框坐标格式：0-1000（Qwen3-VL、Gemini 等）| 0-1 | pixel（Qwen2.5-VL）
    bbox_format: "0-1000"
    json_mode: false    # 服务支持 response_format=json_object 时可打开
    # 推理模型可关闭思考以降低延迟，例如 vLLM 部署的 Qwen3 系列：
    # extra_body: {chat_template_kwargs: {enable_thinking: false}}

  agent_llm:
    base_url: ""        # 留空沿用 vlm
    model: ""           # 留空沿用 vlm；也可换成更快的纯文本模型（需支持函数调用）
    temperature: 0.3
    stream: true

  asr:
    base_url: "http://127.0.0.1:8002/v1"
    model: "your-asr-model"
    language: zh
    prompt: ""          # 可填热词、专有名词，提升识别准确率

  tts:
    base_url: "http://127.0.0.1:8003/v1"
    model: "your-tts-model"
    voice: "alloy"
    response_format: pcm   # pcm（流式，推荐）| wav
    sample_rate: 24000     # 必须与服务返回的 PCM 采样率一致

# ---------------------------------------------------------------- 智能体与后台观察
agent:
  scene_hint: ""        # 场景说明，例如“这是实验室，桌上的笔记本电脑屏幕显示一块百分表”
  filler_text: ""       # 调工具前先播报的过渡语，如“稍等。”；空表示不播报
  max_answer_chars: 60  # 回答长度上限（字），超出后在句末截断
  max_tool_rounds: 6
  max_history_turns: 8

observer:
  enabled: true
  interval: 4           # 每隔几秒检查一次画面
  change_threshold: 6   # 画面变化超过该值才调用大模型（0~255 的平均灰度差）
  max_idle: 30          # 画面不变时，最长多久强制记录一次
  rule_check_interval: 8  # 有监控规则时，最长多久判断一次

# ---------------------------------------------------------------- 长期记忆
# 画面记录、提醒、指令、备忘、监控规则保存在 SQLite（dir/memory.db），关键帧保存在 dir/frames/
memory:
  enabled: true
  dir: data/memory
  retention_days: 30          # 文字记录保留天数
  save_keyframes: true        # 保存关键帧，供 look_at_time 回看当时的画面
  keyframe_retention_days: 7
  summary_minutes: 10         # 每 10 分钟生成一段摘要；0 表示不生成

# ---------------------------------------------------------------- 岗位与职责
# 岗位信息首次启动时写入 data/ops.db，之后在网页“设置”里修改；职责在值守台“添加职责”或 /duties 页面配置
station:
  name: "1 号点位"
  area: ""                   # 看哪里，如“仓库大门和装卸区，左侧是叉车通道”
  scene: ""                  # 场景说明，如“仓库内禁止吸烟”
  owner: ""                  # 岗位负责人
duties:
  db: data/ops.db            # 岗位、职责、告警
  alerts_dir: data/alerts    # 告警截图
  alert_image_days: 90       # 截图保留天数
  verify_delay: 2.0          # 初次命中后隔几秒放大复核
  verify_side: 1280          # 复核、巡检时画面的最长边

# ---------------------------------------------------------------- 执行
# 带编号的现场动作（喇叭喊话、通知值班群、抓拍、设备接口），在网页 /actions 页面管理，存放在 ops.db
actions:
  dir: data/actions          # 抓拍存证的图片

# ---------------------------------------------------------------- 技能
# 在网页 /skills 页面管理；每个技能一个目录（SKILL.md + objects/ + 可选 tools.py）
skills:
  enabled: true
  dir: skills
  max_ref_images: 3

# ---------------------------------------------------------------- 领域知识库
# 在网页 /knowledge 上传文档；数据在 dir 目录
knowledge:
  enabled: true
  dir: data/knowledge
  top_k: 4                  # 每次检索取几段
  max_answer_chars: 150     # 子智能体结论的最大字数

# ---------------------------------------------------------------- 接入入口
# 飞书配置步骤见 DEPLOY_LINUX.md 第 10 节；网页 /feishu、/dingtalk 上可以直接配置
channels:
  feishu:
    enabled: false
    app_id: ""
    app_secret: "${FEISHU_APP_SECRET}"
    alert_chats: []          # 告警推送到哪些群（在群里 @机器人 发 /id 获取 chat_id）
    report_chats: []
    report_times: []         # 如 ["08:00", "18:00"]
    admin_users: []          # 可修改提醒规则、备忘的人（open_id）；为空则所有人都能改
    allowed_chats: []        # 与 allowed_users 都为空时所有人可用
    allowed_users: []
    web_url: ""              # 卡片上“查看现场”按钮的链接
  dingtalk:                  # 钉钉配置步骤见 DEPLOY_LINUX.md 第 13 节，也可以在网页 /dingtalk 上配置
    enabled: false
    client_id: ""            # 原 AppKey
    client_secret: "${DINGTALK_CLIENT_SECRET}"
    robot_code: ""           # 留空则与 client_id 相同
    alert_chats: []          # 群的 openConversationId（cid 开头，在群里 @机器人 发 /id 获取），也可以填员工 userId
    report_chats: []
    report_times: []
    admin_users: []          # 员工 userId
    allowed_chats: []
    allowed_users: []
    web_url: ""

web:
  admin_token: ""       # 技能、知识库管理页的修改口令，为空则不校验
  host: 0.0.0.0
  port: 8000
  ingest_token: ""      # 设置后，外部推流需带 X-Token 请求头（音频 WebSocket 用 ?token=）
