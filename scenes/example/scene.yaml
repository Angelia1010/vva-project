# 场景包示例。复制整个目录为 scenes/default 后修改，或在网页 https://<服务器>:9000/scene 上编辑。
name: 示例-设备间
description: 设备间监控，画面中有一台空压机和墙上的压力表，正常情况下无人值守
areas:
  左侧: 空压机
  右上方: 墙上的压力表
  右侧: 出入门
hotwords: [空压机, 压力表, 兆帕, 巡检]
standards:
  - 压力表正常范围 0.2~0.5 兆帕，超过 0.6 为异常
  - 22:00 到次日 7:00 不应有人进入
rules:
  - condition: 有人进入画面
    cooldown_s: 300
    enabled: false
