<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库管理</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --line:#e3e2dc; --text:#222; --muted:#777; --accent:#4b5bd6; --warn:#c2410c; --ok:#15803d; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { font-size:16px; margin:0; }
  main { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h2 { font-size:14px; margin:0 0 10px; color:var(--muted); font-weight:600; }
  input[type=text], textarea { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  button { padding:6px 12px; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; font-size:13px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .hint { font-size:12px; color:var(--muted); }
  .st-ready { color:var(--ok); } .st-error { color:var(--warn); } .st-indexing { color:var(--accent); }
  .hit { border-top:1px solid var(--line); padding:8px 0; font-size:13px; white-space:pre-wrap; }
  .hit b { color:var(--accent); }
  #answer { white-space:pre-wrap; margin-top:8px; }
  #msg { font-size:13px; } #msg.err { color:var(--warn); } #msg.ok { color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>知识库管理</h1>
  <span id="stats" class="hint"></span>
  <span style="flex:1"></span>
  <span id="msg"></span>
  <input id="token" type="text" placeholder="管理口令" style="width:140px;display:none">
  <a href="/scene" class="hint">场景包</a>
  <a href="/browser" class="hint">返回测试页</a>
</header>
<main>
  <section class="card">
    <h2>文档</h2>
    <p class="hint">上传规章制度、操作规程、设备手册、巡检标准等。监控助手遇到“是否正常、规定是什么、怎么处理”的问题时会查阅。
      支持 <span id="supported"></span>；扫描版 PDF 没有文字层，需要先做文字识别。</p>
    <div class="row"><input id="file" type="file" multiple><button class="primary" id="btn-upload">上传</button></div>
    <table style="margin-top:10px"><thead><tr><th>文档</th><th>大小</th><th>段落</th><th>状态</th><th>上传时间</th><th></th></tr></thead>
      <tbody id="docs"></tbody></table>
  </section>

  <section class="card">
    <h2>测试</h2>
    <input id="q" type="text" placeholder="问题，如：压力表读数多少算异常？">
    <input id="ctx" type="text" placeholder="可选：现场情况，如：压力表读数 0.62MPa" style="margin-top:6px">
    <div class="row"><button class="primary" id="btn-ask">问知识库</button><button id="btn-search">只看检索结果</button></div>
    <div id="answer"></div>
    <div id="hits"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
function msg(text, cls) { const m = $("msg"); m.textContent = text; m.className = cls || ""; }
function token() { return $("token").value.trim(); }
function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + "MB" : Math.max(1, Math.round(n / 1024)) + "KB"; }
const ST = { ready: "可用", indexing: "处理中…", error: "失败" };

async function call(method, url, body, isJson = true) {
  const headers = { "X-Token": token() };
  if (body !== undefined && isJson) headers["Content-Type"] = "application/json";
  const res = await fetch(url, { method, headers, body: body === undefined ? undefined : (isJson ? JSON.stringify(body) : body) });
  if (!res.ok) {
    let d = res.status + ""; try { d = (await res.json()).detail || d; } catch (e) {}
    if (res.status === 401) $("token").style.display = "";
    throw new Error(d);
  }
  return res.json();
}

let pollTimer = null;
function render(data) {
  $("supported").textContent = data.supported.join("、");
  $("stats").textContent = `${data.documents} 个文档，${data.chunks} 段，` + (data.vector_search ? "关键词 + 向量检索" : "关键词检索");
  if (data.token_required) $("token").style.display = "";
  const tb = $("docs"); tb.innerHTML = "";
  if (!data.documents.length) tb.innerHTML = '<tr><td colspan="6" class="hint">还没有文档</td></tr>';
  for (const d of data.documents) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td></td><td>${size(d.size)}</td><td>${d.chunks}</td><td class="st-${d.status}"></td><td>${d.created}</td>
      <td><button class="re">重建</button> <button class="danger del">删除</button></td>`;
    tr.children[0].textContent = d.name;
    tr.children[3].textContent = ST[d.status] + (d.error ? "：" + d.error : "");
    tr.querySelector(".re").onclick = () => act(() => call("POST", `/api/knowledge/${d.id}/reindex`), "已开始重建");
    tr.querySelector(".del").onclick = () => { if (confirm(`删除《${d.name}》？`)) act(() => call("DELETE", `/api/knowledge/${d.id}`), "已删除"); };
    tb.appendChild(tr);
  }
  clearTimeout(pollTimer);
  if (data.documents.some(d => d.status === "indexing")) pollTimer = setTimeout(refresh, 2000);
}
async function refresh() { try { render(await call("GET", "/api/knowledge")); } catch (e) { msg("读取失败：" + e.message, "err"); } }
async function act(fn, ok) { try { render(await fn()); msg(ok, "ok"); } catch (e) { msg("失败：" + e.message, "err"); } }

$("btn-upload").onclick = async () => {
  const files = $("file").files;
  if (!files.length) return msg("请先选择文件", "err");
  for (const f of files) await act(() => call("POST", "/api/knowledge?name=" + encodeURIComponent(f.name), f, false), `已上传《${f.name}》，正在处理`);
  $("file").value = "";
};
$("btn-search").onclick = async () => {
  $("answer").textContent = "";
  try {
    const hits = await call("GET", "/api/knowledge/search?q=" + encodeURIComponent($("q").value));
    $("hits").innerHTML = hits.length ? "" : '<p class="hint">没有命中</p>';
    for (const h of hits) { const d = document.createElement("div"); d.className = "hit";
      d.innerHTML = "<b></b>\n"; d.querySelector("b").textContent = `${h.source}（${h.score}）`; d.append(h.text); $("hits").appendChild(d); }
  } catch (e) { msg("检索失败：" + e.message, "err"); }
};
$("btn-ask").onclick = async () => {
  $("answer").textContent = "查询中…"; $("hits").innerHTML = "";
  try {
    const r = await call("POST", "/api/knowledge/ask", { question: $("q").value, context: $("ctx").value });
    $("answer").textContent = r.answer + (r.sources.length ? "\n出处：" + r.sources.join("；") : "");
  } catch (e) { $("answer").textContent = ""; msg("查询失败：" + e.message, "err"); }
};
refresh();
</script>
</body>
</html>
