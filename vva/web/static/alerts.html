<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>告警 - AI 值守台</title>
<link rel="stylesheet" href="/static/console.css">
<link rel="stylesheet" href="/static/duties.css">
<style>
  /* 页头：标题 + 指标在同一行 */
  .stats { display: flex; gap: 28px; align-items: flex-end; }
  .stats div { display: flex; flex-direction: column; align-items: flex-end; }
  .stats span { font-size: 12px; color: var(--ink-2); }
  .stats b { font: 600 24px/1.15 var(--digits); font-variant-numeric: tabular-nums; }
  .stats b.hot { color: var(--alert-soft); }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .bar select { min-width: 132px; }

  .layout { display: grid; grid-template-columns: minmax(360px, 440px) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }

  /* 左：列表 */
  .rows { padding: 6px; }
  .row { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; padding: 10px; border-radius: 8px;
         border: 1px solid transparent; background: transparent; text-align: left; color: inherit; min-height: 0; cursor: pointer; }
  .row + .row { margin-top: 2px; }
  .row:hover { background: rgba(255, 255, 255, .03); border-color: transparent; }
  .row[aria-current="true"] { background: #152741; border-color: #2F4B72; }
  .row .shot { width: 76px; height: 54px; }
  .row .l1, .row .l2 { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row .nm { font-size: 14px; font-weight: 600; white-space: nowrap; }
  .row .l1 .time { margin-left: auto; }
  .row .l2 { margin-top: 4px; }
  .row .ev { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .status { line-height: 20px; padding: 0 8px; font-size: 12px; flex: 0 0 auto; }

  /* 右：详情 */
  .detail { min-width: 0; padding: 0; display: flex; flex-direction: column; }
  body.app .page > .layout > .detail { overflow: hidden; }
  .d-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 16px 20px; border-bottom: 1px solid var(--rule); }
  .d-head h2 { margin: 0; font-size: 18px; }
  .d-head .spacer { flex: 1; }
  .d-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 20px; }
  .sec > .label { display: block; margin-bottom: 8px; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 320px)); gap: 12px; }
  .shots figure { margin: 0; }
  .shots .shot { aspect-ratio: 16 / 10; }
  .shots figcaption { font-size: 12px; color: var(--ink-2); margin-top: 6px; }
  .why { font-size: 15px; line-height: 1.7; }
  .why-meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-top: 10px; font-size: 13px; }
  .why-meta dt { color: var(--ink-2); } .why-meta dd { margin: 0; color: #D3DCE7; }
  .events { margin: 0; padding: 0 0 0 4px; list-style: none; }
  .events li { position: relative; display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 12px; padding: 0 0 12px 16px; font-size: 13px; }
  .events li::before { content: ""; position: absolute; left: 0; top: 7px; width: 7px; height: 7px; border-radius: 50%; background: #3A5A86; }
  .events li::after { content: ""; position: absolute; left: 3px; top: 16px; bottom: 0; width: 1px; background: #22344F; }
  .events li:last-child::after { display: none; }
  .events .who { color: var(--ink-2); font-size: 12px; }
  .d-foot { flex: 0 0 auto; padding: 14px 20px; border-top: 1px solid var(--rule); background: var(--bar); border-radius: 0 0 10px 10px;
            display: grid; grid-template-columns: 140px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
  .d-foot .btns { display: flex; gap: 8px; }
  .d-foot .opt { grid-column: 1 / -1; }
  .empty { padding: 40px 20px; text-align: center; color: var(--ink-3); }
</style>
</head>
<body class="app">
<header class="duty">
  <span class="brand"><svg width="24" height="24" viewBox="0 0 26 26" fill="none" stroke="#45C8F5" stroke-width="1.6" aria-hidden="true"><path d="M2 13s4-7 11-7 11 7 11 7-4 7-11 7S2 13 2 13Z"/><circle cx="13" cy="13" r="3.5"/><path d="M13 1v3M13 22v3"/></svg>AI 值守台</span>
  <nav aria-label="页面">
    <a href="/browser">值守台</a>
    <a href="/duties">职责</a>
    <a href="/alerts" aria-current="page">告警</a>
    <a href="/actions">执行</a>
    <a href="/skills">技能</a>
    <a href="/knowledge">知识库</a>
    <a href="/settings">设置</a>
  </nav>
  <div class="lamps"><span id="msg" class="toast" role="status"></span></div>
  <span id="clock" class="clock" aria-label="当前时间"></span>
</header>

<div class="page">
  <div class="page-head">
    <div><h1>告警中心</h1><p id="sub">职责命中后的记录：截图、依据、通知了谁、谁在什么时候怎么处理的。</p></div>
    <span class="spacer"></span>
    <input id="token" class="token" type="password" placeholder="管理口令" aria-label="管理口令">
    <div class="stats">
      <div><span>今日告警</span><b id="s-today">0</b></div>
      <div><span>待处理</span><b id="s-pending">0</b></div>
      <div><span>本周误报率</span><b id="s-false">—</b></div>
      <div><span>平均响应</span><b id="s-resp">—</b></div>
    </div>
  </div>

  <div class="bar">
    <div class="seg" role="group" aria-label="状态" id="f-status">
      <button type="button" data-v="" aria-pressed="true">全部</button>
      <button type="button" data-v="pending,handling" aria-pressed="false">待处理</button>
      <button type="button" data-v="resolved" aria-pressed="false">已处理</button>
      <button type="button" data-v="false" aria-pressed="false">误报</button>
      <button type="button" data-v="trial" aria-pressed="false">试运行</button>
      <button type="button" data-v="record" aria-pressed="false">巡检记录</button>
    </div>
    <label for="f-duty" class="sr-only">职责</label>
    <select id="f-duty"><option value="">全部职责</option></select>
    <label for="f-days" class="sr-only">时间</label>
    <select id="f-days"><option value="1">今天</option><option value="7" selected>最近 7 天</option><option value="30">最近 30 天</option><option value="0">全部时间</option></select>
  </div>

  <div class="layout">
    <section class="panel rows" aria-label="告警列表" id="rows"></section>
    <section class="panel detail" aria-label="告警详情" id="detail"><p class="empty">选择左侧的一条告警查看详情。</p></section>
  </div>
</div>

<script src="/static/console.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let status = params.get("status") || "", current = Number(params.get("id")) || 0, msgTimer = null, loadedDuties = false, listed = [];
function msg(text, cls) { const m = $("msg"); m.textContent = text; m.className = "toast " + (cls || ""); clearTimeout(msgTimer); msgTimer = setTimeout(() => { m.textContent = ""; }, 5000); }
const lvl = (l) => l === "urgent" ? '<span class="tag urgent">紧急</span>' : l === "important" ? '<span class="tag important">重要</span>' : "";
const boxStyle = (b) => b ? `left:${b[0] * 100}%;top:${b[1] * 100}%;width:${(b[2] - b[0]) * 100}%;height:${(b[3] - b[1]) * 100}%` : "";
function fmtResp(s) { if (s == null) return "—"; return s < 60 ? s + "″" : Math.floor(s / 60) + "′" + String(s % 60).padStart(2, "0") + "″"; }

async function load() {
  const q = new URLSearchParams({ status, duty: $("f-duty").value, days: $("f-days").value });
  let r;
  try { r = await vva.api("GET", "/api/alerts?" + q); } catch (e) { msg(e.message, "err"); return; }
  const s = r.stats;
  $("s-today").textContent = s.today; $("s-pending").textContent = s.pending; $("s-pending").className = s.pending ? "hot" : "";
  $("s-false").textContent = s.false_rate_week == null ? "—" : Math.round(s.false_rate_week * 100) + "%";
  $("s-resp").textContent = fmtResp(s.avg_response_s);
  if (!loadedDuties) {
    loadedDuties = true;
    const sel = $("f-duty");
    for (const d of r.duties) { const o = document.createElement("option"); o.value = d.id; o.textContent = d.name; sel.appendChild(o); }
    if (params.get("duty")) { sel.value = params.get("duty"); return load(); }
  }
  const rows = $("rows"); rows.innerHTML = "";
  listed = r.alerts.map(a => a.id);
  if (!r.alerts.length) {
    rows.innerHTML = '<p class="empty">这段时间没有记录。</p>';
    $("detail").innerHTML = '<p class="empty">选择左侧的一条告警查看详情。</p>';
    return;
  }
  if (current && !listed.includes(current)) current = 0;
  for (const a of r.alerts) {
    const b = document.createElement("button"); b.type = "button"; b.className = "row";
    if (a.id === current) b.setAttribute("aria-current", "true");
    const img = a.images.length ? vva.img(a.images[a.images.length - 1].file) : "";
    const day = new Date(a.ts * 1000).toDateString() !== new Date().toDateString() ? new Date(a.ts * 1000).toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit" }) + " " : "";
    b.innerHTML = `<div class="shot">${img ? `<img src="${img}" alt="" loading="lazy">` : ""}</div>
      <div><div class="l1"><span class="nm">${vva.esc(a.duty_name)}</span>${lvl(a.level)}<span class="time">${day}${a.time.slice(0, 5)}</span></div>
        <div class="l2"><span class="ev">${vva.esc(a.evidence)}</span><span class="status ${a.status}">${a.status_label}</span></div></div>`;
    b.onclick = () => { current = a.id; rows.querySelectorAll(".row").forEach(x => x.removeAttribute("aria-current")); b.setAttribute("aria-current", "true"); showDetail(a.id); };
    rows.appendChild(b);
  }
  if (!current) current = r.alerts[0].id;
  showDetail(current);
}

async function showDetail(id) {
  let a;
  try { a = await vva.api("GET", "/api/alerts/" + id); } catch (e) { $("detail").innerHTML = `<p class="empty">${vva.esc(e.message)}</p>`; return; }
  const open = a.status === "pending" || a.status === "handling";
  const when = new Date(a.ts * 1000).toLocaleString("zh-CN", { hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const shots = a.images.map((im, i) => `<figure><div class="shot"><img src="${vva.img(im.file)}" alt="${vva.esc(im.caption)}">
      ${i === a.images.length - 1 && a.box ? `<div class="box" style="${boxStyle(a.box)}"></div>` : ""}</div><figcaption>${vva.esc(im.caption)}</figcaption></figure>`).join("");
  $("detail").innerHTML = `
    <div class="d-head"><h2>${vva.esc(a.duty_name)}</h2>${lvl(a.level)}<span class="status ${a.status}">${a.status_label}</span>
      <span class="spacer"></span><span class="time">${when}</span><button type="button" class="link danger" id="btn-del">删除</button></div>
    <div class="d-body">
      <div class="sec"><span class="label">判断依据</span>
        <div class="why">${vva.esc(a.evidence || "—")}</div>
        <dl class="why-meta"><dt>职责内容</dt><dd>${vva.esc(a.condition)}</dd>${a.rule_ref ? `<dt>规章依据</dt><dd>${vva.esc(a.rule_ref)}</dd>` : ""}
          ${a.handler ? `<dt>处理人</dt><dd>${vva.esc(a.handler)}${a.handled_text ? " · " + a.handled_text : ""}</dd>` : ""}${a.note ? `<dt>备注</dt><dd>${vva.esc(a.note)}</dd>` : ""}</dl></div>
      <div class="sec"><span class="label">现场截图</span>${shots ? `<div class="shots">${shots}</div>` : '<p class="sub" style="margin:0">没有保存截图。</p>'}</div>
      <div class="sec"><span class="label">处理经过</span>
        <ol class="events">${a.events.map(e => `<li><span class="time">${e.time}</span><span>${vva.esc(e.text)} <span class="who">· ${vva.esc(e.actor)}</span></span></li>`).join("")}</ol></div>
    </div>
    ${a.status === "record" ? "" : `<div class="d-foot">
      <label for="actor" class="sr-only">处理人</label>
      <input id="actor" type="text" placeholder="处理人" value="${vva.esc(localStorage.getItem("vva-actor") || "")}">
      <label for="note" class="sr-only">处理备注</label>
      <input id="note" type="text" placeholder="处理备注，如：已现场劝阻" value="${vva.esc(a.note || "")}">
      <div class="btns">${a.status === "trial" ? `<button type="button" class="primary" data-a="trial_ok">准确</button><button type="button" data-a="false">不准</button>` : `
        <button type="button" class="primary" data-a="resolve">已处理</button>${open ? '<button type="button" data-a="handling">处理中</button>' : ""}<button type="button" data-a="false">误报</button>`}</div>
      <label class="switch opt"><input type="checkbox" id="add-ref" checked>标为误报时，把截图作为“不算”的例子，下次复核时参考</label>
    </div>`}`;
  $("btn-del").onclick = async () => {
    if (!confirm(`删除这条“${a.duty_name}”告警？截图和处理经过会一起删除，不能恢复。`)) return;
    try { await vva.api("DELETE", "/api/alerts/" + a.id); msg("已删除", "ok"); current = 0; load(); }
    catch (e) { msg("删除失败：" + e.message, "err"); }
  };
  $("detail").querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    const actor = $("actor").value.trim() || "值班员";
    try { localStorage.setItem("vva-actor", actor); } catch (e) {}
    try {
      const r = await vva.api("POST", `/api/alerts/${a.id}/action`, { action: b.dataset.a, actor, note: $("note").value.trim(), add_ref: $("add-ref").checked });
      msg(r.ref_added ? "已标为误报，截图已加入“不算”的例子" : "已更新", "ok"); load();
    } catch (e) { msg(e.message, "err"); }
  });
}

$("f-status").querySelectorAll("button").forEach(b => b.onclick = () => {
  status = b.dataset.v; current = 0;
  $("f-status").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  load();
});
$("f-duty").onchange = $("f-days").onchange = () => { current = 0; load(); };
if (params.get("days") !== null && [...$("f-days").options].some(o => o.value === params.get("days"))) $("f-days").value = params.get("days");
// 从值守台“告警中心”跳过来时带着 status=pending：选中“待处理”
$("f-status").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === status || (!status && !x.dataset.v))));

load();
setInterval(() => { if (!document.activeElement || !["TEXTAREA", "INPUT"].includes(document.activeElement.tagName)) load(); }, 20000);
</script>
</body>
</html>
