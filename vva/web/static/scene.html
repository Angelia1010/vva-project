<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场景包 - 监控值守台</title>
<link rel="stylesheet" href="/static/console.css">
<style>
  .layout { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 20px; align-items: start; }
  .scene-form { position: sticky; top: 16px; }
  .scene-form .actions { margin-top: 14px; }

  .targets-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .targets-head h2 { margin: 0; font-size: 15px; }
  .targets-head .spacer { flex: 1; }

  /* 新增 / 编辑目标的表单：展开在列表上方 */
  .editor { border-left: 4px solid var(--steel); margin-bottom: 16px; display: none; }
  .editor.open { display: block; }
  .editor .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .editor .actions { display: flex; gap: 8px; margin-top: 14px; }

  /* 目标：左侧参考图，右侧说明 */
  .target { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; padding: 16px; margin-bottom: 12px; }
  .refs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; align-content: start; }
  .ref { position: relative; aspect-ratio: 4 / 3; background: #dfe5ea; border-radius: 4px; overflow: hidden; }
  .ref img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ref button { position: absolute; top: 4px; right: 4px; padding: 0 7px; line-height: 20px; font-size: 12px;
                background: rgba(23,33,43,.72); color: #fff; border: 0; border-radius: 3px; }
  .ref.add { display: flex; align-items: center; justify-content: center; border: 1px dashed #9aa7b3; background: transparent;
             color: var(--ink-2); font-size: 13px; cursor: pointer; text-align: center; padding: 6px; }
  .ref.add:hover, .ref.add:focus-within { border-color: var(--steel); color: var(--steel); }
  .ref.add input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .target h3 { margin: 0; font-size: 17px; }
  .target .aka { color: var(--ink-2); font-size: 13px; margin-left: 8px; font-weight: 400; }
  .target dl { display: grid; grid-template-columns: 4em 1fr; gap: 4px 10px; margin: 10px 0 12px; font-size: 13px; }
  .target dt { color: var(--ink-2); }
  .target dd { margin: 0; }
  .target .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .target .warn { color: #8a5a00; font-size: 13px; margin: 10px 0 0; }

  .empty-state { padding: 28px; text-align: center; color: var(--ink-2); border: 1px dashed #9aa7b3; border-radius: 6px; line-height: 1.8; }
  .empty-state button { margin-top: 10px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .scene-form { position: static; }
    .target { grid-template-columns: 1fr; }
    .editor .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="duty">
  <span class="brand">监控值守台</span>
  <nav aria-label="页面">
    <a href="/browser">监控</a>
    <a href="/scene" aria-current="page">场景包</a>
    <a href="/knowledge">知识库</a>
  </nav>
  <div class="lamps"><span id="msg" class="toast" role="status"></span></div>
  <span id="clock" class="clock" aria-label="当前时间"></span>
</header>

<div class="page">
  <div class="page-head">
    <div>
      <h1 id="scene-name">场景包</h1>
      <p>告诉监控助手现场有什么、专用设备长什么样、什么算异常。保存后立即生效，不需要重启服务。</p>
    </div>
    <span class="spacer"></span>
    <input id="token" class="token" type="password" placeholder="管理口令" aria-label="管理口令">
  </div>

  <div class="layout">
    <section class="panel scene-form" aria-labelledby="t-scene">
      <h2 id="t-scene">现场说明</h2>
      <label class="field" for="description">场景概况</label>
      <textarea id="description" placeholder="设备间监控，画面中有一台空压机和墙上的压力表，正常无人值守"></textarea>
      <label class="field" for="areas">画面区域<span class="muted">每行一个，位置=是什么</span></label>
      <textarea id="areas" placeholder="左侧=空压机&#10;右上方=压力表&#10;右侧=出入门"></textarea>
      <label class="field" for="standards">判断标准<span class="muted">每行一条</span></label>
      <textarea id="standards" placeholder="压力表正常范围 0.2~0.5 兆帕，超过 0.6 为异常&#10;22:00 到次日 7:00 不应有人进入"></textarea>
      <label class="field" for="rules">规则模板<span class="muted">条件 | 冷却秒数 | 是/否启用</span></label>
      <textarea id="rules" placeholder="有人进入画面 | 300 | 是"></textarea>
      <label class="field" for="hotwords">语音热词<span class="muted">逗号分隔，目标名称会自动加入</span></label>
      <input id="hotwords" type="text" placeholder="空压机，压力表，兆帕">
      <div class="actions"><button class="primary" id="btn-save-scene">保存现场说明</button></div>
    </section>

    <section aria-labelledby="t-targets">
      <div class="targets-head">
        <h2 id="t-targets">特定目标</h2>
        <span class="muted">每个目标 2~3 张裁好的参考图，不同角度或状态各一张</span>
        <span class="spacer"></span>
        <button class="primary" id="btn-new">新增目标</button>
      </div>

      <div class="panel editor" id="editor" aria-labelledby="t-editor">
        <h2 id="t-editor">新增目标</h2>
        <div class="grid">
          <div>
            <label class="field" for="o-name">名称</label>
            <input id="o-name" type="text" placeholder="压力表">
            <label class="field" for="o-aliases">别名<span class="muted">逗号分隔</span></label>
            <input id="o-aliases" type="text" placeholder="表盘，压力计">
            <label class="field" for="o-desc">外观</label>
            <textarea id="o-desc" placeholder="圆形白色表盘，黑色指针，量程 0~1 兆帕"></textarea>
          </div>
          <div>
            <label class="field" for="o-normal">正常时</label>
            <textarea id="o-normal" placeholder="指针在 0.2~0.5 之间"></textarea>
            <label class="field" for="o-abnormal">异常时</label>
            <textarea id="o-abnormal" placeholder="指针超过 0.6，或表盘起雾看不清"></textarea>
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="btn-save-obj">保存目标</button>
          <button id="btn-cancel">取消</button>
        </div>
      </div>

      <div id="objects"></div>
    </section>
  </div>
</div>

<script src="/static/console.js"></script>
<script>
const $ = (id) => document.getElementById(id);
let msgTimer = null;
function msg(text, cls) {
  const m = $("msg"); m.textContent = text; m.className = "toast " + (cls || "");
  clearTimeout(msgTimer); msgTimer = setTimeout(() => { m.textContent = ""; }, 5000);
}
function splitList(s) { return s.split(/[,，、\n]/).map(x => x.trim()).filter(Boolean); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

async function call(method, url, body, isJson = true) {
  const headers = { "X-Token": adminToken() };
  if (body !== undefined && isJson) headers["Content-Type"] = "application/json";
  const res = await fetch(url, { method, headers, body: body === undefined ? undefined : (isJson ? JSON.stringify(body) : body) });
  if (!res.ok) {
    let detail = String(res.status);
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    if (res.status === 401) { $("token").style.display = "block"; $("token").focus(); }
    throw new Error(detail);
  }
  return res.json();
}

function openEditor(o) {
  $("t-editor").textContent = o ? `编辑“${o.name}”` : "新增目标";
  $("o-name").value = o ? o.name : ""; $("o-name").readOnly = !!o;
  $("o-aliases").value = o ? o.aliases.join("，") : "";
  $("o-desc").value = o ? o.description : ""; $("o-normal").value = o ? o.normal : ""; $("o-abnormal").value = o ? o.abnormal : "";
  $("editor").classList.add("open");
  $("editor").scrollIntoView({ block: "nearest" });
  (o ? $("o-aliases") : $("o-name")).focus();
}
function closeEditor() { $("editor").classList.remove("open"); }

function renderScene(s) {
  $("scene-name").textContent = `场景包：${s.name}`;
  $("description").value = s.description || "";
  $("areas").value = Object.entries(s.areas || {}).map(([k, v]) => `${k}=${v}`).join("\n");
  $("hotwords").value = (s.hotwords || []).join("，");
  $("standards").value = (s.standards || []).join("\n");
  $("rules").value = (s.rules || []).map(r => `${r.condition} | ${r.cooldown_s} | ${r.enabled ? "是" : "否"}`).join("\n");
}

function renderObjects(s) {
  const box = $("objects"); box.innerHTML = "";
  if (!s.objects.length) {
    box.innerHTML = `<div class="empty-state">还没有特定目标。<br>把现场专用的设备、指示灯、工牌、标识加进来，监控助手就能对照参考图认出它们。
      <br><button class="primary" type="button">新增第一个目标</button></div>`;
    box.querySelector("button").onclick = () => openEditor(null);
    return;
  }
  for (const o of s.objects) {
    const name = encodeURIComponent(o.name);
    const el = document.createElement("article"); el.className = "panel target";
    const rows = [["外观", o.description], ["正常时", o.normal], ["异常时", o.abnormal]].filter(r => r[1]);
    el.innerHTML = `
      <div class="refs"></div>
      <div>
        <h3>${esc(o.name)}${o.aliases.length ? `<span class="aka">也叫 ${esc(o.aliases.join("、"))}</span>` : ""}</h3>
        ${rows.length ? `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`
                      : '<p class="hint">还没有描述。点“编辑”补充外观和正常、异常时的样子。</p>'}
        <div class="row">
          <button class="snap" type="button">截取当前画面</button>
          <button class="edit" type="button">编辑</button>
          <button class="danger del" type="button">删除目标</button>
        </div>
        ${o.images.length ? "" : '<p class="warn">还没有参考图：只有文字描述时，辨认效果会差一些。</p>'}
      </div>`;
    const refs = el.querySelector(".refs");
    for (const f of o.images) {
      const r = document.createElement("div"); r.className = "ref";
      r.innerHTML = `<img alt="${esc(o.name)}参考图" src="/api/scene/objects/${name}/images/${f}?t=${Date.now()}"><button type="button">删除</button>`;
      r.querySelector("button").onclick = () => act(() => call("DELETE", `/api/scene/objects/${name}/images/${f}`), "已删除参考图", false);
      refs.appendChild(r);
    }
    const add = document.createElement("label"); add.className = "ref add";
    add.innerHTML = `上传参考图<input type="file" accept="image/*" multiple>`;
    add.querySelector("input").onchange = async (e) => {
      for (const file of e.target.files) await act(() => call("POST", `/api/scene/objects/${name}/images`, file, false), "已上传参考图", false);
    };
    refs.appendChild(add);
    el.querySelector(".snap").onclick = () => act(() => call("POST", `/api/scene/objects/${name}/images?from=snapshot`),
      "已截取当前画面。目标在画面里较小时，建议换成裁剪好的局部图", false);
    el.querySelector(".edit").onclick = () => openEditor(o);
    el.querySelector(".del").onclick = () => {
      if (confirm(`删除“${o.name}”和它的参考图？`)) act(() => call("DELETE", `/api/scene/objects/${name}`), "已删除目标", false);
    };
    box.appendChild(el);
  }
}

async function act(fn, okText, withForm = true) {
  try {
    const s = await fn();
    if (withForm) renderScene(s);
    renderObjects(s); msg(okText, "ok"); return true;
  } catch (e) { msg("没有保存：" + e.message, "err"); return false; }
}

$("btn-save-scene").onclick = () => act(() => {
  const areas = {};
  for (const line of $("areas").value.split("\n")) {
    const i = line.search(/[=＝]/); if (i > 0) areas[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  const rules = $("rules").value.split("\n").map(l => l.split(/[|｜]/).map(x => x.trim())).filter(p => p[0])
    .map(p => ({ condition: p[0], cooldown_s: Number(p[1]) || 60, enabled: !/^(否|no|false|0)$/i.test(p[2] || "") }));
  return call("PUT", "/api/scene", { description: $("description").value.trim(), areas,
    hotwords: splitList($("hotwords").value), standards: $("standards").value.split("\n").map(x => x.trim()).filter(Boolean), rules });
}, "已保存现场说明，新启用的规则模板已加入监控提醒");

$("btn-new").onclick = () => openEditor(null);
$("btn-cancel").onclick = closeEditor;
$("btn-save-obj").onclick = async () => {
  if (!$("o-name").value.trim()) { msg("请填写目标名称", "err"); $("o-name").focus(); return; }
  const ok = await act(() => call("POST", "/api/scene/objects", {
    name: $("o-name").value.trim(), aliases: splitList($("o-aliases").value), description: $("o-desc").value.trim(),
    normal: $("o-normal").value.trim(), abnormal: $("o-abnormal").value.trim() }), "已保存目标，接着给它上传参考图", false);
  if (ok) closeEditor();
};

(async () => {
  try {
    const res = await fetch("/api/scene");
    if (!res.ok) throw new Error(res.status === 404 ? "服务端未开启场景包（scene.enabled）" : String(res.status));
    const s = await res.json();
    if (s.token_required) $("token").style.display = "block";
    renderScene(s); renderObjects(s);
  } catch (e) { msg("无法读取场景包：" + e.message, "err"); }
})();
</script>
</body>
</html>
