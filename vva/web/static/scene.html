<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>场景包管理</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --line:#e3e2dc; --text:#222; --muted:#777; --accent:#4b5bd6; --warn:#c2410c; --ok:#15803d; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); background:#fff; }
  header h1 { font-size:16px; margin:0; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .card h2 { font-size:14px; margin:0 0 10px; color:var(--muted); font-weight:600; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
  input[type=text], textarea { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  textarea { min-height:64px; resize:vertical; }
  button { padding:6px 12px; border:1px solid var(--line); background:#fff; border-radius:8px; cursor:pointer; font-size:13px; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--warn); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  .objects { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
  .obj h3 { margin:0 0 4px; font-size:15px; }
  .thumbs { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .thumb { position:relative; }
  .thumb img { width:96px; height:72px; object-fit:cover; border-radius:6px; border:1px solid var(--line); display:block; }
  .thumb button { position:absolute; top:2px; right:2px; padding:0 6px; font-size:12px; }
  .hint { font-size:12px; color:var(--muted); }
  #msg { font-size:13px; }
  #msg.err { color:var(--warn); } #msg.ok { color:var(--ok); }
  @media (max-width:720px) { .grid2 { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>场景包管理</h1>
  <span id="scene-name" class="hint"></span>
  <span style="flex:1"></span>
  <span id="msg"></span>
  <input id="token" type="text" placeholder="管理口令" style="width:140px;display:none">
  <a href="/knowledge" class="hint">知识库</a>
  <a href="/browser" class="hint">返回测试页</a>
</header>
<main>
  <section class="card">
    <h2>场景说明（写进智能体和后台观察的提示词）</h2>
    <div class="grid2">
      <div>
        <label>场景概况</label>
        <textarea id="description" placeholder="例如：设备间监控，画面中有一台空压机和墙上的压力表，正常情况下无人值守"></textarea>
        <label>画面区域（每行一个：位置=是什么）</label>
        <textarea id="areas" placeholder="左侧=空压机&#10;右上方=墙上的压力表"></textarea>
        <label>语音热词（逗号分隔，提高专业术语的识别率；目标名称会自动加入）</label>
        <input id="hotwords" type="text" placeholder="空压机，压力表，兆帕">
      </div>
      <div>
        <label>判断标准（每行一条，如阈值、作业规范）</label>
        <textarea id="standards" placeholder="压力表正常范围 0.2~0.5 兆帕，超过 0.6 为异常"></textarea>
        <label>规则模板（每行一条：条件 | 冷却秒数 | 启用 是/否；启动时自动加入监控提醒）</label>
        <textarea id="rules" placeholder="有人进入画面 | 300 | 是"></textarea>
      </div>
    </div>
    <div class="row"><button class="primary" id="btn-save-scene">保存场景说明</button></div>
  </section>

  <section class="card">
    <h2>特定目标（参考图 + 描述，让模型认识现场的专用设备、标识等）</h2>
    <p class="hint">参考图建议 2~3 张、裁剪到只包含目标，不同角度或状态各一张。智能体被问到这些目标时会对照参考图判断；监控规则提到它们时，后台观察也会带上参考图。</p>
    <div id="objects" class="objects"></div>
  </section>

  <section class="card">
    <h2>新增 / 修改目标</h2>
    <div class="grid2">
      <div>
        <label>名称（与已有名称相同则为修改）</label>
        <input id="o-name" type="text" placeholder="压力表">
        <label>别名（逗号分隔）</label>
        <input id="o-aliases" type="text" placeholder="表盘，压力计">
        <label>外观描述</label>
        <textarea id="o-desc" placeholder="圆形白色表盘，黑色指针，量程 0~1 兆帕"></textarea>
      </div>
      <div>
        <label>正常状态</label>
        <textarea id="o-normal" placeholder="指针在 0.2~0.5 之间"></textarea>
        <label>异常状态</label>
        <textarea id="o-abnormal" placeholder="指针超过 0.6，或表盘起雾看不清"></textarea>
      </div>
    </div>
    <div class="row"><button class="primary" id="btn-save-obj">保存目标</button><span class="hint">保存后可在上方为它上传参考图</span></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let tokenRequired = false;

function msg(text, cls) { const m = $("msg"); m.textContent = text; m.className = cls || ""; if (text) setTimeout(() => { if (m.textContent === text) m.textContent = ""; }, 4000); }
function token() { return $("token").value.trim(); }
function splitList(s) { return s.split(/[,，、\n]/).map(x => x.trim()).filter(Boolean); }

async function call(method, url, body, isJson = true) {
  const headers = { "X-Token": token() };
  if (body !== undefined && isJson) headers["Content-Type"] = "application/json";
  const res = await fetch(url, { method, headers, body: body === undefined ? undefined : (isJson ? JSON.stringify(body) : body) });
  if (!res.ok) {
    let detail = res.status + "";
    try { detail = (await res.json()).detail || detail; } catch (e) {}
    throw new Error(detail);
  }
  return res.json();
}

function render(s) {
  $("scene-name").textContent = "当前场景包：" + s.name;
  $("description").value = s.description || "";
  $("areas").value = Object.entries(s.areas || {}).map(([k, v]) => `${k}=${v}`).join("\n");
  $("hotwords").value = (s.hotwords || []).join("，");
  $("standards").value = (s.standards || []).join("\n");
  $("rules").value = (s.rules || []).map(r => `${r.condition} | ${r.cooldown_s} | ${r.enabled ? "是" : "否"}`).join("\n");
  const box = $("objects"); box.innerHTML = "";
  if (!s.objects.length) box.innerHTML = '<p class="hint">还没有目标，在下方新增。</p>';
  for (const o of s.objects) {
    const el = document.createElement("div"); el.className = "card obj";
    const name = encodeURIComponent(o.name);
    el.innerHTML = `<h3></h3><div class="hint info"></div><div class="thumbs"></div>
      <div class="row"><input type="file" accept="image/*" multiple style="max-width:180px">
      <button class="snap">截取当前画面</button><button class="edit">编辑</button><button class="danger del">删除目标</button></div>`;
    el.querySelector("h3").textContent = o.name + (o.aliases.length ? `（${o.aliases.join("、")}）` : "");
    el.querySelector(".info").textContent = [o.description && "外观：" + o.description, o.normal && "正常：" + o.normal,
                                             o.abnormal && "异常：" + o.abnormal].filter(Boolean).join("；") || "（没有描述）";
    const thumbs = el.querySelector(".thumbs");
    if (!o.images.length) thumbs.innerHTML = '<span class="hint">还没有参考图</span>';
    for (const f of o.images) {
      const t = document.createElement("div"); t.className = "thumb";
      t.innerHTML = `<img src="/api/scene/objects/${name}/images/${f}?t=${Date.now()}"><button title="删除">×</button>`;
      t.querySelector("button").onclick = () => act(() => call("DELETE", `/api/scene/objects/${name}/images/${f}`), "已删除参考图");
      thumbs.appendChild(t);
    }
    el.querySelector("input[type=file]").onchange = async (e) => {
      for (const file of e.target.files) await act(() => call("POST", `/api/scene/objects/${name}/images`, file, false), "已上传参考图");
    };
    el.querySelector(".snap").onclick = () => act(() => call("POST", `/api/scene/objects/${name}/images?from=snapshot`), "已截取当前画面（建议之后换成裁剪好的局部图）");
    el.querySelector(".del").onclick = () => { if (confirm(`删除目标“${o.name}”及其参考图？`)) act(() => call("DELETE", `/api/scene/objects/${name}`), "已删除目标"); };
    el.querySelector(".edit").onclick = () => {
      $("o-name").value = o.name; $("o-aliases").value = o.aliases.join("，"); $("o-desc").value = o.description;
      $("o-normal").value = o.normal; $("o-abnormal").value = o.abnormal; $("o-name").scrollIntoView({behavior: "smooth"});
    };
    box.appendChild(el);
  }
}

async function act(fn, okText) {
  try { const s = await fn(); render(s); msg(okText, "ok"); }
  catch (e) { msg("失败：" + e.message, "err"); if (String(e.message).includes("口令")) $("token").style.display = ""; }
}

$("btn-save-scene").onclick = () => act(() => {
  const areas = {};
  for (const line of $("areas").value.split("\n")) {
    const i = line.search(/[=＝]/); if (i > 0) areas[line.slice(0, i).trim()] = line.slice(i + 1).trim();
  }
  const rules = $("rules").value.split("\n").map(l => l.split(/[|｜]/).map(x => x.trim())).filter(p => p[0])
    .map(p => ({ condition: p[0], cooldown_s: Number(p[1]) || 60, enabled: !/^(否|no|false|0)$/i.test(p[2] || "") }));
  return call("PUT", "/api/scene", { description: $("description").value.trim(), areas,
    hotwords: splitList($("hotwords").value), standards: $("standards").value.split("\n").map(x => x.trim()).filter(Boolean), rules });
}, "已保存场景说明，新启用的规则模板已加入监控提醒");

$("btn-save-obj").onclick = () => act(() => call("POST", "/api/scene/objects", {
  name: $("o-name").value.trim(), aliases: splitList($("o-aliases").value), description: $("o-desc").value.trim(),
  normal: $("o-normal").value.trim(), abnormal: $("o-abnormal").value.trim() }), "已保存目标");

(async () => {
  try {
    const s = await (await fetch("/api/scene")).json();
    tokenRequired = s.token_required; if (tokenRequired) $("token").style.display = "";
    render(s);
  } catch (e) { msg("无法读取场景包：" + e.message, "err"); }
})();
</script>
</body>
</html>
