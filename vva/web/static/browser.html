<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>值守台 - AI 值守台</title>
<link rel="stylesheet" href="/static/console.css">
<link rel="stylesheet" href="/static/duties.css">
<style>
  .station { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 24px 0; }
  .station .badge { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 13px;
                    background: rgba(61,214,140,.12); color: #7BE6B1; }
  .station .badge.off { background: rgba(242,179,61,.12); color: #F5D08A; }
  .station .name { font-size: 20px; font-weight: 700; }
  .station .area { color: var(--ink-2); font-size: 13px; }
  .station .spacer { flex: 1; }
  .stat { display: flex; align-items: baseline; gap: 6px; }
  .stat span { color: var(--ink-2); font-size: 12px; }
  .stat b { font: 600 22px/1 var(--digits); font-variant-numeric: tabular-nums; }
  .stat b.hot { color: var(--alert-soft); }

  /* 三栏固定：左 职责 · 中 画面 · 右 告警与指令。中栏自适应，窗口再窄也不换行，直到平板宽度才改成上下排列 */
  main.desk { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr) minmax(300px, 380px);
              gap: 16px; padding: 14px 24px 24px; align-items: start; }
  .col-duties { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .col-view { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .col-cmd { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .col-duties .head { display: flex; align-items: center; gap: 8px; }
  .col-duties .head h2 { margin: 0; font-size: 16px; }
  .col-duties .head .n { font: 15px var(--digits); color: var(--ink-2); }
  .empty-duties { padding: 16px; border-radius: 8px; border: 1px dashed var(--line); color: var(--ink-3); font-size: 13px; line-height: 1.8; }
  .empty-duties b { color: var(--ink); }
  .ask { margin-top: auto; padding: 12px; border-radius: 8px; background: var(--bar); color: var(--ink-2); font-size: 12px; line-height: 1.8; }
  .ask b { display: block; color: var(--ink-3); font-weight: 500; }
  .setup-line { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }

  /* 画面：取景框，四角刻线 */
  .viewport { position: relative; background: #0C1522; border-radius: 6px; overflow: hidden; aspect-ratio: 16 / 9; }
  .viewport video, .viewport img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .viewport .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
  .viewport::after { content: ""; position: absolute; inset: 10px; pointer-events: none; opacity: .5;
    background:
      linear-gradient(#45C8F5, #45C8F5) top left / 18px 2px no-repeat, linear-gradient(#45C8F5, #45C8F5) top left / 2px 18px no-repeat,
      linear-gradient(#45C8F5, #45C8F5) top right / 18px 2px no-repeat, linear-gradient(#45C8F5, #45C8F5) top right / 2px 18px no-repeat,
      linear-gradient(#45C8F5, #45C8F5) bottom left / 18px 2px no-repeat, linear-gradient(#45C8F5, #45C8F5) bottom left / 2px 18px no-repeat,
      linear-gradient(#45C8F5, #45C8F5) bottom right / 18px 2px no-repeat, linear-gradient(#45C8F5, #45C8F5) bottom right / 2px 18px no-repeat; }
  .hud { position: absolute; padding: 3px 8px; border-radius: 4px; background: rgba(8,14,24,.72); font-size: 12px; color: #C8D4E2; display: inline-flex; align-items: center; gap: 6px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; font-size: 13px; }
  .controls .spacer { flex: 1; }
  .meter { width: 100px; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .meter div { height: 100%; width: 0; background: var(--lamp-ok); transition: width .08s; }

  .timeline { display: flex; flex-direction: column; min-height: 150px; max-height: 260px; }
  .list { overflow-y: auto; flex: 1; font-size: 13px; }
  .tl-item { padding: 6px 0; border-bottom: 1px solid #1A2A42; display: flex; gap: 10px; flex-wrap: wrap; }
  .tl-item .t { color: var(--ink-2); font-family: var(--digits); font-variant-numeric: tabular-nums; flex: 0 0 auto; font-size: 14px; }
  .tl-item .anom { color: var(--alert-soft); width: 100%; padding-left: 58px; }
  #timeline:empty::before { content: "后台每隔几秒记录一次画面，开启摄像头后会出现在这里。"; color: var(--ink-2); }

  .alerts-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .alerts-head h2 { margin: 0; font-size: 15px; }
  .alert-item + .alert-item { margin-top: 14px; padding-top: 14px; border-top: 1px solid #2A2030; }
  .alert-item .sent { color: var(--ink-2); font-size: 12px; margin: 8px 0; }
  .alert-item .btns { display: flex; gap: 8px; }
  .alert-item .btns button { flex: 1; }
  .no-alert { color: var(--ink-2); font-size: 13px; }

  .command { flex: 1; min-height: 380px; display: flex; flex-direction: column; gap: 10px; }
  .command .head { display: flex; align-items: center; gap: 8px; }
  .command .head h2 { margin: 0; font-size: 15px; }
  #chat { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 2px; min-height: 160px; }
  .msg { max-width: 88%; padding: 8px 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; border-radius: 10px; }
  .msg.user { align-self: flex-end; background: #1E4E7A; border-bottom-right-radius: 2px; }
  .msg.bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--rule); border-bottom-left-radius: 2px; }
  .msg.sys { align-self: stretch; background: rgba(255,107,94,.08); color: #FFC2BB; border: 1px solid rgba(255,107,94,.25); font-size: 13px; }
  .msg .src { font-size: 11px; opacity: .75; margin-bottom: 2px; }
  .tool { align-self: flex-start; font-size: 12px; color: var(--ink-2); padding-left: 2px; }
  #chat:empty::before { content: "说话或在下方输入指令，例如：你负责哪些事？门口现在有几个人？上午 9 点左右发生了什么？有快递到门口就告诉我。";
    margin: auto 0; padding: 0 10%; text-align: center; color: var(--ink-2); line-height: 1.9; }
  .voice { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--bar); border: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); }
  .voice.on { background: rgba(69,200,245,.08); border-color: rgba(69,200,245,.35); color: #7FD8F7; }
  .voice .bars { display: flex; align-items: center; gap: 3px; height: 16px; }
  .voice .bars span { width: 3px; height: 5px; border-radius: 2px; background: currentColor; opacity: .5; }
  .voice.on .bars span { opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .voice.on .bars span { animation: eq .9s ease-in-out infinite; }
    .voice.on .bars span:nth-child(2) { animation-delay: .15s; } .voice.on .bars span:nth-child(3) { animation-delay: .3s; }
    .voice.on .bars span:nth-child(4) { animation-delay: .45s; }
  }
  @keyframes eq { 50% { height: 16px; } }
  .voice .said { color: #D3DCE7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  form#form { display: flex; gap: 8px; margin: 0; }
  form#form input { font-size: 14px; height: 44px; }
  form#form button { flex: 0 0 auto; min-width: 64px; }
  #btn-ptt.primary { min-width: 104px; }
  @media (max-width: 1100px) {      /* 窄屏：画面在上占满一行，职责和指令并排在下 */
    main.desk { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .col-view { grid-column: 1 / -1; grid-row: 1; }
  }
  @media (max-width: 720px) { main.desk { grid-template-columns: minmax(0, 1fr); padding: 12px; } }
</style>
</head>
<body>
<header class="duty">
  <span class="brand"><svg width="24" height="24" viewBox="0 0 26 26" fill="none" stroke="#45C8F5" stroke-width="1.6" aria-hidden="true"><path d="M2 13s4-7 11-7 11 7 11 7-4 7-11 7S2 13 2 13Z"/><circle cx="13" cy="13" r="3.5"/><path d="M13 1v3M13 22v3"/></svg>AI 值守台</span>
  <nav aria-label="页面">
    <a href="/browser" aria-current="page">值守台</a>
    <a href="/duties">职责</a>
    <a href="/alerts">告警</a>
    <a href="/skills">技能</a>
    <a href="/knowledge">知识库</a>
    <a href="/settings">设置</a>
  </nav>
  <div class="lamps">
    <div class="stat"><span>今日告警</span><b id="st-today">0</b></div>
    <div class="stat"><span>待处理</span><b id="st-pending">0</b></div>
    <span id="pill-conn" class="pill">未连接</span>
    <span id="pill-cam" class="pill">摄像头关闭</span>
    <span id="pill-mic" class="pill">麦克风关闭</span>
  </div>
  <input id="token" class="token" type="password" placeholder="管理口令" aria-label="管理口令">
  <span id="clock" class="clock" aria-label="当前时间"></span>
</header>
<div id="notice" role="status"></div>

<div class="station">
  <span class="badge" id="st-badge"><span class="dot running" aria-hidden="true"></span><span id="st-state">值守中</span></span>
  <span class="name" id="st-name">正在读取…</span>
  <span class="area" id="st-area"></span>
  <span class="spacer"></span>
  <span class="area" id="st-owner"></span>
  <a href="/settings" style="font-size:13px">岗位设置</a>
</div>

<main class="desk">
  <!-- 左：我的职责 -->
  <aside class="panel col-duties" aria-labelledby="t-duties">
    <div class="head">
      <h2 id="t-duties">我的职责</h2><span class="n" id="duty-n"></span>
      <span style="flex:1"></span>
      <button type="button" class="primary" id="btn-add-duty">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 2v10M2 7h10"/></svg> 添加职责</button>
    </div>
    <div id="duties" style="display:flex;flex-direction:column;gap:8px"></div>
    <div id="temps-wrap" style="display:none;flex-direction:column;gap:8px">
      <h3 class="group-title">临时任务</h3>
      <div id="temps" style="display:flex;flex-direction:column;gap:8px"></div>
    </div>
    <div class="ask"><b>你可以这样问我</b>你负责哪些事？门口现在有几个人？今天有几次告警？上午 9 点左右发生了什么？有快递到门口就告诉我。</div>
    <div class="setup-line"><a href="/skills" id="setup-skill">技能</a><a href="/knowledge" id="setup-kb">知识库</a><a href="/duties">管理全部职责</a></div>
  </aside>

  <!-- 中：画面 -->
  <section class="col-view" aria-label="实时画面">
    <div class="panel" style="padding:10px">
      <div class="viewport">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="placeholder" class="placeholder">点击下方“开启摄像头”</div>
        <span class="hud" style="left:14px;top:12px"><span class="dot error" aria-hidden="true"></span>LIVE · <span id="hud-name"></span></span>
        <span class="hud" style="left:14px;bottom:12px"><span class="dot temp" aria-hidden="true"></span><span id="hud-watch">正在值守</span></span>
      </div>
      <div class="controls">
        <button id="btn-cam" class="primary">开启摄像头</button>
        <select id="sel-cam" title="选择摄像头" aria-label="选择摄像头"></select>
        <select id="sel-fps" title="画面上传频率" aria-label="画面上传频率">
          <option value="1">每秒 1 帧</option>
          <option value="2" selected>每秒 2 帧</option>
          <option value="5">每秒 5 帧</option>
        </select>
        <span class="spacer"></span>
        <button id="btn-mic" class="primary">开启麦克风</button>
        <button id="btn-ptt" type="button" style="display:none" title="也可以按住空格键说话">按住说话</button>
        <div class="meter" title="麦克风音量"><div id="meter"></div></div>
      </div>
    </div>
    <div class="panel timeline">
      <h2>画面时间线</h2>
      <div id="timeline" class="list"></div>
    </div>
  </section>

  <!-- 右：告警与指令 -->
  <section class="col-cmd">
    <div class="panel alert-panel calm" id="alert-panel" aria-labelledby="t-alerts">
      <div class="alerts-head">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#FF8A7F" stroke-width="1.6" aria-hidden="true"><path d="M8 1.5a4 4 0 0 0-4 4V9l-1.5 2.5h11L12 9V5.5a4 4 0 0 0-4-4ZM6.5 13.5a1.5 1.5 0 0 0 3 0"/></svg>
        <h2 id="t-alerts">待处理告警</h2><span class="num" id="alert-n" style="color:var(--alert-soft)"></span>
        <span style="flex:1"></span><a href="/alerts" style="font-size:12px">告警中心</a>
      </div>
      <div id="alerts"></div>
    </div>
    <div class="panel command">
      <div class="head"><h2>指令</h2><span style="flex:1"></span>
        <button id="btn-stop" type="button" class="ghost">打断</button>
        <button id="btn-reset" type="button" class="ghost">清空对话</button></div>
      <div id="chat" aria-live="polite"></div>
      <div class="voice" id="voice"><div class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <span id="voice-state">空闲</span><span class="said" id="voice-said"></span></div>
      <form id="form">
        <label for="input" class="sr-only">输入指令</label>
        <input id="input" type="text" placeholder="说话或输入，如：有人吸烟就通知我" autocomplete="off">
        <button class="primary" type="submit">发送</button>
      </form>
    </div>
  </section>
</main>
<script src="/static/console.js"></script>
<script src="/static/duty-editor.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const chat = $("chat"), tl = $("timeline"), video = $("video"), overlay = $("overlay");
let caps = {}, ws = null, botMsg = null, boxes = [], boxTimer = null;

// ============================================================ 通用界面
function pill(id, text, cls) { const el = $(id); if (el) { el.textContent = text; el.className = "pill " + (cls || ""); } }
function scroll(el) { el.scrollTop = el.scrollHeight; }
function addMsg(cls, text, src) {
  const d = document.createElement("div"); d.className = "msg " + cls;
  if (src) { const s = document.createElement("div"); s.className = "src"; s.textContent = src; d.appendChild(s); }
  const body = document.createElement("span"); body.textContent = text || ""; d.appendChild(body);
  chat.appendChild(d); scroll(chat); return body;
}
const TOOL_NAMES = {look_now: "看当前画面", locate: "定位目标", look_back: "回看", look_sequence: "看一段时间",
  search_timeline: "查时间线", search_memory: "查记录", look_at_time: "看当时的画面", list_duties: "查看职责",
  add_task: "添加临时任务", remove_task: "取消临时任务", pause_duty: "暂停职责", resume_duty: "恢复职责",
  query_alerts: "查告警", ask_knowledge: "查知识库", remember_note: "记下备忘", forget_note: "删除备忘"};
function addTool(name, args) {
  const d = document.createElement("div"); d.className = "tool";
  const brief = Object.values(args || {}).filter(v => typeof v === "string").join("，").slice(0, 40);
  d.textContent = "· " + (TOOL_NAMES[name] || name) + (brief ? "：" + brief : "");
  chat.appendChild(d); scroll(chat);
}
function addTimeline(e) {
  const d = document.createElement("div"); d.className = "tl-item";
  const t = document.createElement("span"); t.className = "t"; t.textContent = e.time;
  const s = document.createElement("span"); s.textContent = e.summary + (e.people_count != null ? `（${e.people_count}人）` : "");
  d.append(t, s);
  if (e.anomalies && e.anomalies.length) { const a = document.createElement("div"); a.className = "anom"; a.textContent = "异常：" + e.anomalies.join("、"); d.appendChild(a); }
  tl.prepend(d); while (tl.children.length > 200) tl.removeChild(tl.lastChild);
}
function notice(text) { const n = $("notice"); n.textContent = text; n.style.display = text ? "block" : "none"; }
function setVoice(state, said, on) {
  $("voice-state").textContent = state; $("voice").className = "voice" + (on ? " on" : "");
  if (said !== undefined) $("voice-said").textContent = said ? "“" + said + "”" : "";
}

// 在视频上画框：框坐标是相对原始画面的 0~1，需换算到 object-fit:contain 后的显示区域
function drawBoxes() {
  const W = overlay.clientWidth, H = overlay.clientHeight;
  overlay.width = W; overlay.height = H;
  const ctx = overlay.getContext("2d"); ctx.clearRect(0, 0, W, H);
  const srv = $("server-video");
  const vw = srv ? srv.naturalWidth : video.videoWidth, vh = srv ? srv.naturalHeight : video.videoHeight;
  if (!vw || !boxes.length) return;
  const s = Math.min(W / vw, H / vh), dw = vw * s, dh = vh * s, ox = (W - dw) / 2, oy = (H - dh) / 2;
  ctx.font = "600 13px 'Noto Sans SC', sans-serif";
  for (const b of boxes) {
    const color = b.alert ? "#FF6B5E" : "#45C8F5";
    const [x1, y1, x2, y2] = b.box, x = ox + x1 * dw, y = oy + y1 * dh;
    ctx.lineWidth = 2; ctx.strokeStyle = color; ctx.strokeRect(x, y, (x2 - x1) * dw, (y2 - y1) * dh);
    if (b.label) {
      const w = ctx.measureText(b.label).width + 12, ty = Math.max(0, y - 22);
      ctx.fillStyle = color; ctx.fillRect(x - 1, ty, w, 20);
      ctx.fillStyle = b.alert ? "#1A0B0A" : "#051A24"; ctx.fillText(b.label, x + 5, ty + 14);
    }
  }
}
function showBoxes(list) {
  boxes = list || []; drawBoxes();
  clearTimeout(boxTimer); boxTimer = setTimeout(() => { boxes = []; drawBoxes(); }, 10000);
}
window.addEventListener("resize", drawBoxes);

// ============================================================ 岗位、职责、告警
let overviewTimer = null;
function refreshSoon() { clearTimeout(overviewTimer); overviewTimer = setTimeout(loadOverview, 300); }
async function loadOverview() {
  let o;
  try { o = await vva.api("GET", "/api/overview"); } catch (e) { return; }
  const st = o.station;
  $("st-name").textContent = st.name; $("hud-name").textContent = st.name;
  $("st-area").textContent = st.area ? "看哪里：" + st.area : "";
  $("st-owner").textContent = st.owner ? "岗位负责人 " + st.owner : "";
  $("st-badge").className = "badge" + (st.paused ? " off" : "");
  $("st-state").textContent = st.paused ? "已暂停值守" : "值守中";
  $("st-today").textContent = o.stats.today; $("st-pending").textContent = o.stats.pending;
  $("st-pending").className = o.stats.pending ? "hot" : "";
  renderDuties(o.duties);
  renderAlerts(o.open_alerts);
}
function renderDuties(list) {
  const long = list.filter(d => !d.temporary), temps = list.filter(d => d.temporary);
  const watching = list.filter(d => d.kind === "watch" && d.state === "running").length;
  $("duty-n").textContent = long.length || "";
  $("hud-watch").textContent = watching ? `正在值守 ${watching} 项职责` : "当前没有生效的盯守职责";
  const box = $("duties"); box.innerHTML = "";
  if (!long.length) {
    box.innerHTML = `<div class="empty-duties"><b>还没有职责。</b>告诉它要盯什么、发现了通知谁，它会一直值守。<br>
      <button type="button" class="primary" id="btn-tpl" style="margin-top:10px">从行业模板添加</button></div>`;
    $("btn-tpl").onclick = () => DutyEditor.openTemplates({ onSaved: loadOverview });
  }
  const actions = {
    test: testDuty,
    toggle: async (d) => { try { await vva.api("PUT", "/api/duties/" + d.id, { enabled: !d.enabled }); loadOverview(); } catch (e) { notice(e.message); } },
    edit: (d) => DutyEditor.open(d.temporary ? { ...d, temporary: false, expires: 0, source: "web" } : d, { onSaved: loadOverview }),
    alerts: (d) => { location.href = "/alerts?duty=" + encodeURIComponent(d.id); },
  };
  for (const d of long) box.appendChild(dutyCard(d, actions));
  $("temps-wrap").style.display = temps.length ? "flex" : "none";
  const tbox = $("temps"); tbox.innerHTML = "";
  for (const d of temps) tbox.appendChild(dutyCard(d, { toggle: actions.toggle, edit: actions.edit }));
}
async function testDuty(d, btn) {
  btn.disabled = true; btn.textContent = "检查中…";
  try {
    const r = await vva.api("POST", "/api/duties/test", { id: d.id });
    addMsg("sys", `试一下「${d.name}」：${r.match ? (d.kind === "inspect" ? "异常" : "命中") : (d.kind === "inspect" ? "正常" : "当前未命中")}。${r.evidence || ""}`);
    if (r.box) showBoxes([{ box: r.box, label: d.name, alert: r.match }]);
  } catch (e) { notice("检查失败：" + e.message); }
  btn.disabled = false; btn.textContent = "试一下";
}
function renderAlerts(list) {
  const box = $("alerts");
  $("alert-n").textContent = list.length || "";
  $("alert-panel").className = "panel alert-panel" + (list.length ? "" : " calm");
  if (!list.length) { box.innerHTML = '<p class="no-alert">没有待处理的告警。</p>'; return; }
  box.innerHTML = "";
  for (const a of list.slice(0, 3)) {
    const el = document.createElement("div"); el.className = "alert-item";
    const img = a.images && a.images.length ? vva.img(a.images[a.images.length - 1].file) : "";
    el.innerHTML = `<div class="acard"><div class="shot">${img ? `<img src="${img}" alt="告警画面">` : ""}</div>
      <div class="body"><div class="title">${vva.esc(a.duty_name)} ${a.level === "urgent" ? '<span class="tag urgent">紧急</span>' : a.level === "important" ? '<span class="tag important">重要</span>' : ""}
        <span class="status ${a.status}">${a.status_label}</span></div>
        <span class="when">${a.time} · ${vva.ago(a.ts)}</span><span class="ev">${vva.esc(a.evidence)}</span></div></div>
      <div class="sent">${a.rule_ref ? "依据 " + vva.esc(a.rule_ref) : ""}</div>
      <div class="btns"><button type="button" class="primary" data-a="resolve">已处理</button><button type="button" data-a="false">误报</button>
        <button type="button" class="ghost" data-a="ask">追问</button></div>`;
    el.querySelectorAll("button").forEach(b => b.onclick = async () => {
      if (b.dataset.a === "ask") { $("input").value = `关于刚才的「${a.duty_name}」告警，现在还是这样吗？`; $("input").focus(); return; }
      try { await vva.api("POST", `/api/alerts/${a.id}/action`, { action: b.dataset.a, actor: "值班员" }); loadOverview(); }
      catch (e) { notice(e.message); }
    });
    box.appendChild(el);
  }
}
$("btn-add-duty").onclick = () => DutyEditor.open(null, { onSaved: loadOverview });

// ============================================================ 对话通道 /ws
function handle(ev) {
  switch (ev.type) {
    case "hello": tl.innerHTML = ""; (ev.timeline || []).forEach(addTimeline); loadOverview(); break;
    case "user": addMsg("user", ev.text, ev.source === "voice" ? "语音" : ""); botMsg = null; setVoice("思考中…", ev.source === "voice" ? ev.text : "", true); break;
    case "assistant_start": botMsg = addMsg("bot", ""); break;
    case "assistant_delta": if (!botMsg) botMsg = addMsg("bot", ""); botMsg.textContent += ev.text; scroll(chat); break;
    case "assistant_end":
      if (ev.interrupted && botMsg) botMsg.textContent += " …（已打断）";
      botMsg = null; if ($("voice-state").textContent === "思考中…") setVoice("空闲", "", false); break;
    case "tool": addTool(ev.name, ev.args); botMsg = null; break;
    case "timeline": addTimeline(ev); break;
    case "alert": addMsg("sys", ev.text); break;
    case "alert_new":
      if (ev.alert && ev.alert.box && ev.alert.status !== "record") showBoxes([{ box: ev.alert.box, label: ev.alert.duty_name, alert: true }]);
      refreshSoon(); break;
    case "alert_update": case "duties_changed": case "rules": refreshSoon(); break;
    case "bbox": showBoxes(ev.boxes); break;
    case "vad": if (ev.state === "start") setVoice("正在听", "", true); else setVoice("识别中…", undefined, true); break;
    case "tts": if (ev.state === "speaking") setVoice("播报中", undefined, true); else setVoice("空闲", "", false); break;
    case "asr": if (ev.ignored) { addMsg("sys", `（${ev.reason || "已忽略"}）${ev.text}`); setVoice("空闲", "", false); } break;
    case "error": addMsg("sys", "出错了：" + ev.message); break;
  }
}
function connectChat() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => pill("pill-conn", "已连接", "on");
  ws.onclose = () => { pill("pill-conn", "已断开，重连中", "hot"); setTimeout(connectChat, 2000); };
  ws.onmessage = (m) => handle(JSON.parse(m.data));
}
$("form").onsubmit = (e) => {
  e.preventDefault(); const t = $("input").value.trim();
  if (!t || !ws || ws.readyState !== 1) return;
  ensurePlayer();
  ws.send(JSON.stringify({type: "chat", text: t})); $("input").value = "";
};
$("btn-stop").onclick = () => { ws && ws.send(JSON.stringify({type: "interrupt"})); stopPlayback(); };
$("btn-reset").onclick = () => { ws && ws.send(JSON.stringify({type: "reset"})); chat.innerHTML = ""; stopPlayback(); };

// ============================================================ 摄像头：本地预览 + 定时上传 JPEG
let camStream = null, frameTimer = null, uploading = false;
const grab = document.createElement("canvas");

async function listCameras() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  const sel = $("sel-cam"), cur = sel.value; sel.innerHTML = "";
  devs.forEach((d, i) => { const o = document.createElement("option"); o.value = d.deviceId; o.textContent = d.label || `摄像头 ${i + 1}`; sel.appendChild(o); });
  if (cur) sel.value = cur;
}
async function startCamera() {
  stopCamera();
  const id = $("sel-cam").value;
  camStream = await navigator.mediaDevices.getUserMedia({
    video: { width: {ideal: 1280}, height: {ideal: 720}, ...(id ? {deviceId: {exact: id}} : {}) }, audio: false });
  video.srcObject = camStream; $("placeholder").style.display = "none";
  await listCameras();
  $("btn-cam").textContent = "关闭摄像头"; $("btn-cam").className = "active";
  pill("pill-cam", "摄像头上传中", "on");
  restartUpload();
}
function stopCamera() {
  clearInterval(frameTimer); frameTimer = null;
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null; video.srcObject = null; $("placeholder").style.display = "flex";
  $("btn-cam").textContent = "开启摄像头"; $("btn-cam").className = "primary";
  pill("pill-cam", "摄像头关闭");
}
function restartUpload() {
  clearInterval(frameTimer);
  if (!camStream) return;
  frameTimer = setInterval(uploadFrame, 1000 / Number($("sel-fps").value));
}
async function uploadFrame() {
  if (uploading || !video.videoWidth) return;    // 上一帧还没传完就跳过，避免积压
  uploading = true;
  try {
    grab.width = video.videoWidth; grab.height = video.videoHeight;
    grab.getContext("2d").drawImage(video, 0, 0);
    const blob = await new Promise(r => grab.toBlob(r, "image/jpeg", 0.85));
    const res = await fetch("/api/ingest/frame", { method: "POST", body: blob,
      headers: { "Content-Type": "image/jpeg", "X-Timestamp": String(Date.now() / 1000), "X-Token": TOKEN } });
    if (!res.ok) pill("pill-cam", "上传失败 " + res.status, "hot");
  } catch (e) { pill("pill-cam", "上传失败", "hot"); }
  finally { uploading = false; }
}
$("btn-cam").onclick = async () => {
  if (camStream) return stopCamera();
  try { await startCamera(); } catch (e) { notice("无法打开摄像头：" + e.message + "（请允许浏览器使用摄像头）"); }
};
$("sel-cam").onchange = () => camStream && startCamera();
$("sel-fps").onchange = restartUpload;

// ============================================================ 麦克风：采集 → 16k PCM16 → WebSocket；接收语音并播放
let micStream = null, micCtx = null, micNode = null, micSink = null, audioWs = null;
let inRate = 16000, outRate = 24000, resampleBuf = [], resamplePos = 0, sendBuf = [];
let playCtx = null, playTime = 0, playing = new Set();


function ensurePlayer() {
  if (!playCtx) playCtx = new AudioContext();
  if (playCtx.state === "suspended") playCtx.resume();
  return playCtx.state === "running";
}
// 浏览器要求用户先操作过页面才允许播放声音：首次点击/按键时激活
let soundTip = "";
function unlockSound() {
  ensurePlayer();
  if (soundTip) { soundTip = ""; showTips(); }
  document.removeEventListener("pointerdown", unlockSound);
  document.removeEventListener("keydown", unlockSound);
}
function playPcm(arrayBuf) {
  if (!ensurePlayer() && !soundTip) { soundTip = "收到语音回答但浏览器未允许播放：点击页面任意位置即可启用语音播报"; showTips(); }
  const pcm = new Int16Array(arrayBuf);
  if (!pcm.length) return;
  const buf = playCtx.createBuffer(1, pcm.length, outRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const src = playCtx.createBufferSource(); src.buffer = buf; src.connect(playCtx.destination);
  playTime = Math.max(playTime, playCtx.currentTime + 0.05);
  src.start(playTime); playTime += buf.duration;
  playing.add(src); src.onended = () => playing.delete(src);
}
function stopPlayback() {
  playing.forEach(s => { try { s.stop(); } catch (e) {} }); playing.clear();
  playTime = 0;
}

// 浏览器采样率（通常 48k）线性插值降到服务端需要的采样率
function resampleTo(input, srcRate, dstRate) {
  for (const v of input) resampleBuf.push(v);
  const ratio = srcRate / dstRate, out = [];
  let pos = resamplePos;   // 保留上一块的小数位置，块与块之间无缝衔接
  while (pos + 1 < resampleBuf.length) {
    const i = Math.floor(pos), f = pos - i;
    out.push(resampleBuf[i] * (1 - f) + resampleBuf[i + 1] * f);
    pos += ratio;
  }
  const drop = Math.min(Math.floor(pos), resampleBuf.length);
  resampleBuf = resampleBuf.slice(drop);
  resamplePos = pos - drop;
  return out;
}

// 语音通道：页面加载后就建立并保持连接（只打字提问也能收到语音回答），断开后自动重连
let audioReady = null, audioRetry = null;
function connectAudio() {
  if (audioReady && audioWs && audioWs.readyState <= 1) return audioReady;
  clearTimeout(audioRetry);
  audioReady = new Promise((resolve, reject) => {
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/ingest/audio" + (TOKEN ? "?token=" + TOKEN : "");
    const sock = new WebSocket(url); sock.binaryType = "arraybuffer";
    audioWs = sock;
    let ready = false;
    sock.onmessage = (m) => {
      if (typeof m.data === "string") {
        const msg = JSON.parse(m.data);
        if (msg.type === "config") {
          inRate = msg.input_sample_rate || 16000; outRate = msg.output_sample_rate || 24000;
          ready = true; resolve();
        } else if (msg.type === "clear") stopPlayback();
      } else playPcm(m.data);
    };
    sock.onerror = () => { if (!ready) reject(new Error("语音通道连接失败")); };
    sock.onclose = () => {
      if (!ready) reject(new Error("语音通道连接失败"));
      if (audioWs !== sock) return;
      audioWs = null; audioReady = null;
      if (micStream) { pill("pill-mic", "语音通道断开", "hot"); stopMic(); }
      audioRetry = setTimeout(() => connectAudio().catch(() => {}), 2000);
    };
  });
  return audioReady;
}
async function startMic() {
  ensurePlayer();
  await connectAudio();   // 通常页面加载时已连好，这里只在断线时补连
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  micCtx = new AudioContext();
  const src = micCtx.createMediaStreamSource(micStream);
  resampleBuf = []; resamplePos = 0; sendBuf = [];
  const chunk = Math.round(inRate * 0.04);   // 每 40ms 发送一包
  const onData = (data) => {
    let sum = 0; for (const v of data) sum += v * v;
    $("meter").style.width = Math.min(100, Math.sqrt(sum / data.length) * 400) + "%";
    for (const v of resampleTo(data, micCtx.sampleRate, inRate)) sendBuf.push(v);
    while (sendBuf.length >= chunk) {
      const part = sendBuf.splice(0, chunk), pcm = new Int16Array(chunk);
      for (let i = 0; i < chunk; i++) pcm[i] = Math.max(-1, Math.min(1, part[i])) * 32767;
      if (audioWs && audioWs.readyState === 1) audioWs.send(pcm.buffer);
    }
  };
  try {
    // 首选 AudioWorklet（独立线程采集，不卡页面）；脚本放在静态文件里，避免部分浏览器拒绝从 blob 地址加载
    await micCtx.audioWorklet.addModule("/static/mic-worklet.js");
    micNode = new AudioWorkletNode(micCtx, "cap");
    micNode.port.onmessage = (e) => onData(e.data);
    src.connect(micNode);   // 不连接到扬声器，避免回放自己的声音
  } catch (e) {
    // 退回 ScriptProcessor（旧接口，所有浏览器都支持）；必须接到输出才会工作，用静音节点接上
    console.warn("AudioWorklet 不可用，改用 ScriptProcessor：", e);
    micNode = micCtx.createScriptProcessor(2048, 1, 1);
    micNode.onaudioprocess = (ev) => onData(new Float32Array(ev.inputBuffer.getChannelData(0)));
    micSink = micCtx.createGain(); micSink.gain.value = 0;
    src.connect(micNode); micNode.connect(micSink); micSink.connect(micCtx.destination);
  }
  $("btn-mic").textContent = "关闭麦克风"; $("btn-mic").className = "active";
  pill("pill-mic", "麦克风已开启", "on");
}
function stopMic() {
  if (micNode) micNode.disconnect();
  if (micSink) micSink.disconnect();
  if (micCtx) micCtx.close();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micNode = micSink = micCtx = micStream = null;
  $("meter").style.width = "0";
  $("btn-mic").textContent = "开启麦克风"; $("btn-mic").className = "primary";
  // 不关闭语音通道：关掉麦克风后打字提问仍能听到回答
  pill("pill-mic", "麦克风关闭");
}
// ============================================================ 按住说话（voice.mode=push_to_talk）
let pttDown = false;
async function pttPress() {
  if (pttDown) return;
  pttDown = true;
  try { if (!micStream) await startMic(); }
  catch (e) { pttDown = false; notice("无法开启语音：" + e.message); return; }
  if (!pttDown) return;                     // 麦克风打开期间已经松开
  ensurePlayer(); stopPlayback();
  ws && ws.send(JSON.stringify({type: "ptt", state: "down"}));
  $("btn-ptt").className = "active"; $("btn-ptt").textContent = "松开结束";
}
function pttRelease() {
  if (!pttDown) return;
  pttDown = false;
  ws && ws.send(JSON.stringify({type: "ptt", state: "up"}));
  $("btn-ptt").className = "primary"; $("btn-ptt").textContent = "按住说话";
}
function enablePtt() {
  const b = $("btn-ptt");
  b.style.display = ""; b.className = "primary";
  b.onpointerdown = (e) => { e.preventDefault(); pttPress(); };
  b.onpointerup = b.onpointerleave = b.onpointercancel = pttRelease;
  const typing = () => document.activeElement && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  document.addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat && !typing()) { e.preventDefault(); pttPress(); } });
  document.addEventListener("keyup", (e) => { if (e.code === "Space" && !typing()) { e.preventDefault(); pttRelease(); } });
}

$("btn-mic").onclick = async () => {
  if (micStream) return stopMic();
  try { await startMic(); }
  catch (e) { stopMic(); notice("无法开启语音：" + e.message); }
};

// ============================================================ 技能、知识库概况
async function loadSetup() {
  try {
    const on = (await vva.api("GET", "/api/skills")).skills.filter(s => s.enabled);
    $("setup-skill").textContent = on.length ? `技能 ${on.length} 个已启用` : "技能：未启用";
  } catch (e) { $("setup-skill").textContent = "技能"; }
  try {
    const kb = await vva.api("GET", "/api/knowledge");
    $("setup-kb").textContent = kb.documents.length ? `知识库 ${kb.documents.length} 份文档` : "知识库：还没有文档";
  } catch (e) { $("setup-kb").textContent = "知识库"; }
}
loadSetup();
setInterval(loadOverview, 30000);      // 生效时间段变化等需要定时刷新

// ============================================================ 启动检查
let baseTips = [];
function showTips() { notice(baseTips.concat(soundTip ? [soundTip] : []).join("；")); }
(async () => {
  const tips = [];
  if (!navigator.mediaDevices) {
    tips.push("当前页面无法使用摄像头/麦克风：请通过 localhost（可用 SSH 端口转发）或 HTTPS 访问，见 DEPLOY_LINUX.md");
  }
  try {
    caps = await (await fetch("/api/capabilities")).json();
    if (!caps.video_push) {
      const img = document.createElement("img");
      img.id = "server-video"; img.src = "/video.mjpg"; img.alt = "实时画面";
      img.style.cssText = "display:block;width:100%;height:100%;object-fit:contain";
      img.onload = drawBoxes;
      img.onerror = () => setTimeout(() => { img.src = "/video.mjpg?t=" + Date.now(); }, 2000);
      video.replaceWith(img);
      $("placeholder").style.display = "none";
      for (const id of ["btn-cam", "sel-cam", "sel-fps"]) $(id).style.display = "none";
      pill("pill-cam", "服务端摄像头", "on");
    }
    if (!caps.audio_in_push) {
      $("btn-mic").disabled = true;
      tips.push(caps.voice ? "语音由服务器本机麦克风采集，网页麦克风不可用"
                           : "语音未开启（--no-audio 或语音模块启动失败），可以打字提问");
    }
    if (caps.voice_mode === "push_to_talk" && caps.audio_in_push) {
      enablePtt();
      tips.push("按住说话模式：按住“按住说话”按钮或空格键说话，松开后识别");
    }
    if (caps.audio_out_push) {
      connectAudio().catch(() => {});
      soundTip = "点击页面任意位置即可启用语音播报";
      document.addEventListener("pointerdown", unlockSound);
      document.addEventListener("keydown", unlockSound);
    }
  } catch (e) { tips.push("无法连接服务端"); }
  baseTips = tips; showTips();
  try { await listCameras(); } catch (e) {}
  connectChat();
})();
</script>
