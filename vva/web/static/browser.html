<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>监控值守台</title>
<link rel="stylesheet" href="/static/console.css">
<style>
  main.desk { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(360px, 1fr); gap: 16px; padding: 16px 20px;
              height: calc(100vh - 59px); }
  .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

  /* 画面：深色取景框，四角刻线提示这是监控画面 */
  .viewport { position: relative; background: #0f171f; border-radius: 6px; overflow: hidden; aspect-ratio: 16 / 9; }
  .viewport video, .viewport img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .viewport .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8696a5; }
  .viewport::after { content: ""; position: absolute; inset: 10px; pointer-events: none;
    background:
      linear-gradient(#8fb8dc, #8fb8dc) top left / 18px 2px no-repeat, linear-gradient(#8fb8dc, #8fb8dc) top left / 2px 18px no-repeat,
      linear-gradient(#8fb8dc, #8fb8dc) top right / 18px 2px no-repeat, linear-gradient(#8fb8dc, #8fb8dc) top right / 2px 18px no-repeat,
      linear-gradient(#8fb8dc, #8fb8dc) bottom left / 18px 2px no-repeat, linear-gradient(#8fb8dc, #8fb8dc) bottom left / 2px 18px no-repeat,
      linear-gradient(#8fb8dc, #8fb8dc) bottom right / 18px 2px no-repeat, linear-gradient(#8fb8dc, #8fb8dc) bottom right / 2px 18px no-repeat;
    opacity: .55; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; font-size: 13px; }
  .controls .spacer { flex: 1; }
  .meter { width: 110px; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
  .meter div { height: 100%; width: 0; background: var(--lamp-ok); transition: width .08s; }

  /* 现场配置：一条横栏，两项之间用竖线分开 */
  .setup { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border: 1px solid var(--rule);
           border-left: 4px solid var(--steel); border-radius: 6px; }
  .setup > div { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
  .setup > div + div { border-left: 1px solid var(--rule); }
  .setup h3 { margin: 0; font-size: 15px; }
  .setup p { margin: 0; color: var(--ink-2); font-size: 13px; flex: 1; }
  .setup p b { color: var(--ink); font-family: var(--digits); font-size: 16px; font-weight: 600; }
  .setup a.go { align-self: flex-start; margin-top: 4px; padding: 6px 14px; border-radius: 4px; background: var(--steel);
                color: #fff; text-decoration: none; font-size: 13px; }
  .setup a.go:hover { background: #1b4366; }
  .setup .empty { color: var(--lamp-busy); }

  .timeline { flex: 1; min-height: 140px; display: flex; flex-direction: column; }
  .list { overflow-y: auto; flex: 1; font-size: 13px; }
  .tl-item { padding: 6px 0; border-bottom: 1px solid #e3e8ec; display: flex; gap: 10px; }
  .tl-item .t { color: var(--ink-2); font-family: var(--digits); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .tl-item .anom { color: var(--lamp-alert); }

  /* 指令区 */
  .command { display: flex; flex-direction: column; min-height: 0; }
  #chat { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 4px 2px 8px; }
  .msg { max-width: 88%; padding: 8px 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; border-radius: 6px; }
  .msg.user { align-self: flex-end; background: var(--steel); color: #fff; border-bottom-right-radius: 0; }
  .msg.bot { align-self: flex-start; background: #fff; border: 1px solid var(--rule); border-bottom-left-radius: 0; }
  .msg.sys { align-self: stretch; background: #fdf0ee; color: #8a2a20; border-left: 3px solid var(--lamp-alert); font-size: 13px; border-radius: 0; }
  .msg .src { font-size: 11px; opacity: .75; margin-bottom: 2px; }
  .tool { align-self: flex-start; font-size: 12px; color: var(--ink-2); padding-left: 2px; font-family: var(--digits); }
  #rules { font-size: 13px; color: var(--ink-2); margin-top: 8px; }
  form#form { display: flex; gap: 8px; margin-top: 10px; }
  form#form input { font-size: 15px; padding: 10px 12px; }
  form#form button { flex: 0 0 auto; white-space: nowrap; padding: 0 20px; }
  #chat:empty::before { content: "说话或在下方输入指令，例如：画面里有几个人？桌上的保温杯是什么颜色？上午 9 点左右发生了什么？有人离开座位就提醒我。";
    margin: auto 0; padding: 0 12%; text-align: center; color: var(--ink-2); line-height: 1.9; }
  #timeline:empty::before { content: "后台每隔几秒记录一次画面，开启摄像头后会出现在这里。"; color: var(--ink-2); }
  #btn-ptt.primary { min-width: 104px; }

  @media (max-width: 960px) {
    main.desk { grid-template-columns: 1fr; height: auto; }
    .command { min-height: 70vh; }
  }
  @media (max-width: 520px) { .setup { grid-template-columns: 1fr; } .setup > div + div { border-left: 0; border-top: 1px solid var(--rule); } }
</style>
</head>
<body>
<header class="duty">
  <span class="brand">监控值守台</span>
  <nav aria-label="页面">
    <a href="/browser" aria-current="page">监控</a>
    <a href="/skills">技能</a>
    <a href="/knowledge">知识库</a>
  </nav>
  <div class="lamps">
    <span id="pill-conn" class="pill">未连接</span>
    <span id="pill-cam" class="pill">摄像头关闭</span>
    <span id="pill-mic" class="pill">麦克风关闭</span>
    <span id="pill-state" class="pill">空闲</span>
  </div>
  <span id="clock" class="clock" aria-label="当前时间"></span>
</header>
<div id="notice"></div>
<main class="desk">
  <section class="col">
    <div class="panel">
      <div class="viewport">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="placeholder" class="placeholder">点击下方“开启摄像头”</div>
      </div>
      <div class="controls">
        <button id="btn-cam" class="primary">开启摄像头</button>
        <select id="sel-cam" title="选择摄像头" aria-label="选择摄像头"></select>
        <select id="sel-fps" title="画面上传频率" aria-label="画面上传频率">
          <option value="1">每秒 1 帧</option>
          <option value="2" selected>每秒 2 帧</option>
          <option value="5">每秒 5 帧</option>
        </select>
        <span class="spacer"></span>
        <button id="btn-mic" class="primary">开启麦克风</button>
        <button id="btn-ptt" type="button" style="display:none" title="也可以按住空格键说话">按住说话</button>
        <div class="meter" title="麦克风音量"><div id="meter"></div></div>
      </div>
    </div>

    <div class="setup" aria-label="现场配置">
      <div>
        <h3>技能</h3>
        <p id="setup-scene">正在读取…</p>
        <a class="go" href="/skills">管理技能</a>
      </div>
      <div>
        <h3>知识库</h3>
        <p id="setup-kb">正在读取…</p>
        <a class="go" href="/knowledge">上传和管理文档</a>
      </div>
    </div>

    <div class="panel timeline">
      <h2>画面时间线</h2>
      <div id="timeline" class="list"></div>
    </div>
  </section>

  <section class="panel command">
    <h2>指令</h2>
    <div id="chat"></div>
    <div id="rules"></div>
    <form id="form">
      <input id="input" type="text" placeholder="说话或在这里输入，如：画面里有几个人？上午 9 点左右发生了什么？" autocomplete="off">
      <button class="primary" type="submit">发送</button>
    </form>
    <div class="controls">
      <button id="btn-stop" type="button">打断</button>
      <button id="btn-reset" type="button">清空对话</button>
      <span class="spacer"></span>
      <a href="/" class="hint">服务端摄像头页面</a>
    </div>
  </section>
</main>
<script src="/static/console.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const chat = $("chat"), tl = $("timeline"), video = $("video"), overlay = $("overlay");
let caps = {}, ws = null, botMsg = null, boxes = [], boxTimer = null;

// ============================================================ 通用界面
function pill(id, text, cls) { const el = $(id); el.textContent = text; el.className = "pill " + (cls || ""); }
function scroll(el) { el.scrollTop = el.scrollHeight; }
function addMsg(cls, text, src) {
  const d = document.createElement("div"); d.className = "msg " + cls;
  if (src) { const s = document.createElement("div"); s.className = "src"; s.textContent = src; d.appendChild(s); }
  const body = document.createElement("span"); body.textContent = text || ""; d.appendChild(body);
  chat.appendChild(d); scroll(chat); return body;
}
const TOOL_NAMES = {look_now:"看当前画面", locate:"定位目标", look_back:"回看", look_sequence:"看一段时间",
  search_timeline:"查时间线", add_watch:"添加监控", list_watches:"查看监控", remove_watch:"删除监控"};
function addTool(name, args) {
  const d = document.createElement("div"); d.className = "tool";
  d.textContent = "🔧 " + (TOOL_NAMES[name] || name) + " " + JSON.stringify(args);
  chat.appendChild(d); scroll(chat);
}
function addTimeline(e) {
  const d = document.createElement("div"); d.className = "tl-item";
  const t = document.createElement("span"); t.className = "t"; t.textContent = e.time;
  const s = document.createElement("span"); s.textContent = e.summary + (e.people_count != null ? `（${e.people_count}人）` : "");
  d.append(t, s);
  if (e.anomalies && e.anomalies.length) { const a = document.createElement("div"); a.className = "anom"; a.textContent = "异常：" + e.anomalies.join("、"); d.appendChild(a); }
  tl.prepend(d); while (tl.children.length > 200) tl.removeChild(tl.lastChild);
}
function renderRules(rules) {
  $("rules").textContent = rules && rules.length ? "监控中：" + rules.map(r => `${r.id} ${r.condition}`).join("；") : "";
}
function notice(text) { const n = $("notice"); n.textContent = text; n.style.display = text ? "block" : "none"; }

// 在视频上画框：框坐标是相对原始画面的 0~1，需换算到 object-fit:contain 后的显示区域
function drawBoxes() {
  const W = overlay.clientWidth, H = overlay.clientHeight;
  overlay.width = W; overlay.height = H;
  const ctx = overlay.getContext("2d"); ctx.clearRect(0, 0, W, H);
  const srv = $("server-video");   // 服务端视频源（RTSP 等）模式下显示的画面
  const vw = srv ? srv.naturalWidth : video.videoWidth, vh = srv ? srv.naturalHeight : video.videoHeight;
  if (!vw || !boxes.length) return;
  const s = Math.min(W / vw, H / vh), dw = vw * s, dh = vh * s, ox = (W - dw) / 2, oy = (H - dh) / 2;
  ctx.lineWidth = 3; ctx.strokeStyle = "#ffcc00"; ctx.fillStyle = "#ffcc00"; ctx.font = "14px sans-serif";
  for (const b of boxes) {
    const [x1, y1, x2, y2] = b.box;
    ctx.strokeRect(ox + x1 * dw, oy + y1 * dh, (x2 - x1) * dw, (y2 - y1) * dh);
    if (b.label) ctx.fillText(b.label, ox + x1 * dw + 4, Math.max(14, oy + y1 * dh - 6));
  }
}
function showBoxes(list) {
  boxes = list || []; drawBoxes();
  clearTimeout(boxTimer); boxTimer = setTimeout(() => { boxes = []; drawBoxes(); }, 8000);
}
window.addEventListener("resize", drawBoxes);

// ============================================================ 对话通道 /ws
function handle(ev) {
  switch (ev.type) {
    case "hello": tl.innerHTML = ""; (ev.timeline || []).forEach(addTimeline); renderRules(ev.status.rules); break;
    case "user": addMsg("user", ev.text, ev.source === "voice" ? "🎤 语音" : ""); botMsg = null; break;
    case "assistant_start": botMsg = addMsg("bot", ""); pill("pill-state", "思考中…", "busy"); break;
    case "assistant_delta": if (!botMsg) botMsg = addMsg("bot", ""); botMsg.textContent += ev.text; scroll(chat); break;
    case "assistant_end":
      if (ev.interrupted && botMsg) botMsg.textContent += " …（已打断）";
      botMsg = null; pill("pill-state", "空闲"); break;
    case "tool": addTool(ev.name, ev.args); botMsg = null; break;
    case "timeline": addTimeline(ev); break;
    case "alert": addMsg("sys", "🔔 " + ev.text); break;
    case "rules": renderRules(ev.rules); break;
    case "bbox": showBoxes(ev.boxes); break;
    case "vad": if (ev.state === "start") pill("pill-state", "正在听…", "hot"); else pill("pill-state", "识别中…", "busy"); break;
    case "tts": if (ev.state === "speaking") pill("pill-state", "正在说…", "busy"); else pill("pill-state", "空闲"); break;
    case "asr": if (ev.ignored) addMsg("sys", `（${ev.reason || "已忽略"}）${ev.text}`); break;
    case "error": addMsg("sys", "⚠️ " + ev.message); break;
  }
}
function connectChat() {
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  ws.onopen = () => pill("pill-conn", "已连接", "on");
  ws.onclose = () => { pill("pill-conn", "已断开，重连中", "hot"); setTimeout(connectChat, 2000); };
  ws.onmessage = (m) => handle(JSON.parse(m.data));
}
$("form").onsubmit = (e) => {
  e.preventDefault(); const t = $("input").value.trim();
  if (!t || !ws || ws.readyState !== 1) return;
  ensurePlayer();   // 用户点击时顺便激活声音播放
  ws.send(JSON.stringify({type: "chat", text: t})); $("input").value = "";
};
$("btn-stop").onclick = () => { ws && ws.send(JSON.stringify({type: "interrupt"})); stopPlayback(); };
$("btn-reset").onclick = () => { ws && ws.send(JSON.stringify({type: "reset"})); chat.innerHTML = ""; stopPlayback(); };

// ============================================================ 摄像头：本地预览 + 定时上传 JPEG
let camStream = null, frameTimer = null, uploading = false;
const grab = document.createElement("canvas");

async function listCameras() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput");
  const sel = $("sel-cam"), cur = sel.value; sel.innerHTML = "";
  devs.forEach((d, i) => { const o = document.createElement("option"); o.value = d.deviceId; o.textContent = d.label || `摄像头 ${i + 1}`; sel.appendChild(o); });
  if (cur) sel.value = cur;
}
async function startCamera() {
  stopCamera();
  const id = $("sel-cam").value;
  camStream = await navigator.mediaDevices.getUserMedia({
    video: { width: {ideal: 1280}, height: {ideal: 720}, ...(id ? {deviceId: {exact: id}} : {}) }, audio: false });
  video.srcObject = camStream; $("placeholder").style.display = "none";
  await listCameras();
  $("btn-cam").textContent = "关闭摄像头"; $("btn-cam").className = "active";
  pill("pill-cam", "摄像头上传中", "on");
  restartUpload();
}
function stopCamera() {
  clearInterval(frameTimer); frameTimer = null;
  if (camStream) camStream.getTracks().forEach(t => t.stop());
  camStream = null; video.srcObject = null; $("placeholder").style.display = "flex";
  $("btn-cam").textContent = "开启摄像头"; $("btn-cam").className = "primary";
  pill("pill-cam", "摄像头关闭");
}
function restartUpload() {
  clearInterval(frameTimer);
  if (!camStream) return;
  frameTimer = setInterval(uploadFrame, 1000 / Number($("sel-fps").value));
}
async function uploadFrame() {
  if (uploading || !video.videoWidth) return;    // 上一帧还没传完就跳过，避免积压
  uploading = true;
  try {
    grab.width = video.videoWidth; grab.height = video.videoHeight;
    grab.getContext("2d").drawImage(video, 0, 0);
    const blob = await new Promise(r => grab.toBlob(r, "image/jpeg", 0.85));
    const res = await fetch("/api/ingest/frame", { method: "POST", body: blob,
      headers: { "Content-Type": "image/jpeg", "X-Timestamp": String(Date.now() / 1000), "X-Token": TOKEN } });
    if (!res.ok) pill("pill-cam", "上传失败 " + res.status, "hot");
  } catch (e) { pill("pill-cam", "上传失败", "hot"); }
  finally { uploading = false; }
}
$("btn-cam").onclick = async () => {
  if (camStream) return stopCamera();
  try { await startCamera(); } catch (e) { notice("无法打开摄像头：" + e.message + "（请允许浏览器使用摄像头）"); }
};
$("sel-cam").onchange = () => camStream && startCamera();
$("sel-fps").onchange = restartUpload;

// ============================================================ 麦克风：采集 → 16k PCM16 → WebSocket；接收语音并播放
let micStream = null, micCtx = null, micNode = null, audioWs = null;
let inRate = 16000, outRate = 24000, resampleBuf = [], resamplePos = 0, sendBuf = [];
let playCtx = null, playTime = 0, playing = new Set();

const WORKLET = `class Cap extends AudioWorkletProcessor {
  process(inputs) { const ch = inputs[0] && inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; }
} registerProcessor("cap", Cap);`;

function ensurePlayer() {
  if (!playCtx) playCtx = new AudioContext();
  if (playCtx.state === "suspended") playCtx.resume();
  return playCtx.state === "running";
}
// 浏览器要求用户先操作过页面才允许播放声音：首次点击/按键时激活
let soundTip = "";
function unlockSound() {
  ensurePlayer();
  if (soundTip) { soundTip = ""; showTips(); }
  document.removeEventListener("pointerdown", unlockSound);
  document.removeEventListener("keydown", unlockSound);
}
function playPcm(arrayBuf) {
  if (!ensurePlayer() && !soundTip) { soundTip = "收到语音回答但浏览器未允许播放：点击页面任意位置即可启用语音播报"; showTips(); }
  const pcm = new Int16Array(arrayBuf);
  if (!pcm.length) return;
  const buf = playCtx.createBuffer(1, pcm.length, outRate);
  const ch = buf.getChannelData(0);
  for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
  const src = playCtx.createBufferSource(); src.buffer = buf; src.connect(playCtx.destination);
  playTime = Math.max(playTime, playCtx.currentTime + 0.05);
  src.start(playTime); playTime += buf.duration;
  playing.add(src); src.onended = () => playing.delete(src);
}
function stopPlayback() {
  playing.forEach(s => { try { s.stop(); } catch (e) {} }); playing.clear();
  playTime = 0;
}

// 浏览器采样率（通常 48k）线性插值降到服务端需要的采样率
function resampleTo(input, srcRate, dstRate) {
  for (const v of input) resampleBuf.push(v);
  const ratio = srcRate / dstRate, out = [];
  let pos = resamplePos;   // 保留上一块的小数位置，块与块之间无缝衔接
  while (pos + 1 < resampleBuf.length) {
    const i = Math.floor(pos), f = pos - i;
    out.push(resampleBuf[i] * (1 - f) + resampleBuf[i + 1] * f);
    pos += ratio;
  }
  const drop = Math.min(Math.floor(pos), resampleBuf.length);
  resampleBuf = resampleBuf.slice(drop);
  resamplePos = pos - drop;
  return out;
}

// 语音通道：页面加载后就建立并保持连接（只打字提问也能收到语音回答），断开后自动重连
let audioReady = null, audioRetry = null;
function connectAudio() {
  if (audioReady && audioWs && audioWs.readyState <= 1) return audioReady;
  clearTimeout(audioRetry);
  audioReady = new Promise((resolve, reject) => {
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/ingest/audio" + (TOKEN ? "?token=" + TOKEN : "");
    const sock = new WebSocket(url); sock.binaryType = "arraybuffer";
    audioWs = sock;
    let ready = false;
    sock.onmessage = (m) => {
      if (typeof m.data === "string") {
        const msg = JSON.parse(m.data);
        if (msg.type === "config") {
          inRate = msg.input_sample_rate || 16000; outRate = msg.output_sample_rate || 24000;
          ready = true; resolve();
        } else if (msg.type === "clear") stopPlayback();
      } else playPcm(m.data);
    };
    sock.onerror = () => { if (!ready) reject(new Error("语音通道连接失败")); };
    sock.onclose = () => {
      if (!ready) reject(new Error("语音通道连接失败"));
      if (audioWs !== sock) return;
      audioWs = null; audioReady = null;
      if (micStream) { pill("pill-mic", "语音通道断开", "hot"); stopMic(); }
      audioRetry = setTimeout(() => connectAudio().catch(() => {}), 2000);
    };
  });
  return audioReady;
}
async function startMic() {
  ensurePlayer();
  await connectAudio();   // 通常页面加载时已连好，这里只在断线时补连
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  micCtx = new AudioContext();
  await micCtx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], {type: "application/javascript"})));
  const src = micCtx.createMediaStreamSource(micStream);
  micNode = new AudioWorkletNode(micCtx, "cap");
  resampleBuf = []; resamplePos = 0; sendBuf = [];
  const chunk = Math.round(inRate * 0.04);   // 每 40ms 发送一包
  micNode.port.onmessage = (e) => {
    const data = e.data;
    let sum = 0; for (const v of data) sum += v * v;
    $("meter").style.width = Math.min(100, Math.sqrt(sum / data.length) * 400) + "%";
    for (const v of resampleTo(data, micCtx.sampleRate, inRate)) sendBuf.push(v);
    while (sendBuf.length >= chunk) {
      const part = sendBuf.splice(0, chunk), pcm = new Int16Array(chunk);
      for (let i = 0; i < chunk; i++) pcm[i] = Math.max(-1, Math.min(1, part[i])) * 32767;
      if (audioWs && audioWs.readyState === 1) audioWs.send(pcm.buffer);
    }
  };
  src.connect(micNode);   // 不连接到扬声器，避免回放自己的声音
  $("btn-mic").textContent = "关闭麦克风"; $("btn-mic").className = "active";
  pill("pill-mic", "麦克风已开启", "on");
}
function stopMic() {
  if (micNode) micNode.disconnect();
  if (micCtx) micCtx.close();
  if (micStream) micStream.getTracks().forEach(t => t.stop());
  micNode = micCtx = micStream = null;
  $("meter").style.width = "0";
  $("btn-mic").textContent = "开启麦克风"; $("btn-mic").className = "primary";
  // 不关闭语音通道：关掉麦克风后打字提问仍能听到回答
  pill("pill-mic", "麦克风关闭");
}
// ============================================================ 按住说话（voice.mode=push_to_talk）
let pttDown = false;
async function pttPress() {
  if (pttDown) return;
  pttDown = true;
  try { if (!micStream) await startMic(); }
  catch (e) { pttDown = false; notice("无法开启语音：" + e.message); return; }
  if (!pttDown) return;                     // 麦克风打开期间已经松开
  ensurePlayer(); stopPlayback();
  ws && ws.send(JSON.stringify({type: "ptt", state: "down"}));
  $("btn-ptt").className = "active"; $("btn-ptt").textContent = "松开结束";
}
function pttRelease() {
  if (!pttDown) return;
  pttDown = false;
  ws && ws.send(JSON.stringify({type: "ptt", state: "up"}));
  $("btn-ptt").className = "primary"; $("btn-ptt").textContent = "按住说话";
}
function enablePtt() {
  const b = $("btn-ptt");
  b.style.display = ""; b.className = "primary";
  b.onpointerdown = (e) => { e.preventDefault(); pttPress(); };
  b.onpointerup = b.onpointerleave = b.onpointercancel = pttRelease;
  const typing = () => document.activeElement && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  document.addEventListener("keydown", (e) => { if (e.code === "Space" && !e.repeat && !typing()) { e.preventDefault(); pttPress(); } });
  document.addEventListener("keyup", (e) => { if (e.code === "Space" && !typing()) { e.preventDefault(); pttRelease(); } });
}

$("btn-mic").onclick = async () => {
  if (micStream) return stopMic();
  try { await startMic(); }
  catch (e) { stopMic(); notice("无法开启语音：" + e.message); }
};

// ============================================================ 现场配置概况
async function loadSetup() {
  const sceneEl = $("setup-scene"), kbEl = $("setup-kb");
  try {
    const res = await fetch("/api/skills");
    if (!res.ok) throw new Error();
    const on = (await res.json()).skills.filter(s => s.enabled);
    const objs = on.reduce((n, s) => n + s.objects.length, 0);
    const imgs = on.reduce((n, s) => n + s.objects.reduce((m, o) => m + o.images.length, 0), 0);
    sceneEl.innerHTML = on.length
      ? `<b>${on.length}</b> 个技能已启用，<b>${objs}</b> 个特定目标，<b>${imgs}</b> 张参考图`
      : '<span class="empty">还没有启用的技能。</span>告诉模型现场有什么、专用设备长什么样、怎么判断。';
  } catch (e) { sceneEl.textContent = "未开启技能"; }
  try {
    const kb = await (await fetch("/api/knowledge")).json();
    const ready = kb.documents.filter(d => d.status === "ready").length;
    kbEl.innerHTML = kb.documents.length
      ? `<b>${ready}</b> 份文档可用，共 <b>${kb.stats.chunks}</b> 段` + (kb.stats.vector_search ? "，向量检索已开启" : "")
      : '<span class="empty">还没有文档。</span>上传规章、规程、手册，判断“是否正常、怎么处理”时会查阅。';
  } catch (e) { kbEl.textContent = "未开启知识库"; }
}
loadSetup();

// ============================================================ 启动检查
let baseTips = [];
function showTips() { notice(baseTips.concat(soundTip ? [soundTip] : []).join("；")); }
(async () => {
  const tips = [];
  if (!navigator.mediaDevices) {
    tips.push("当前页面无法使用摄像头/麦克风：请通过 localhost（可用 SSH 端口转发）或 HTTPS 访问，见 DEPLOY_LINUX.md");
  }
  try {
    caps = await (await fetch("/api/capabilities")).json();
    if (!caps.video_push) {
      // 视频来自服务端（RTSP 摄像头等）：显示服务端画面，麦克风照常可用
      const img = document.createElement("img");
      img.id = "server-video"; img.src = "/video.mjpg"; img.alt = "服务端画面";
      img.style.cssText = "display:block;width:100%;height:100%;object-fit:contain";
      img.onload = drawBoxes;
      img.onerror = () => setTimeout(() => { img.src = "/video.mjpg?t=" + Date.now(); }, 2000);
      video.replaceWith(img);
      $("placeholder").style.display = "none";
      for (const id of ["btn-cam", "sel-cam", "sel-fps"]) $(id).style.display = "none";
      pill("pill-cam", "服务端摄像头", "on");
    }
    if (!caps.audio_in_push) {
      $("btn-mic").disabled = true;
      tips.push(caps.voice ? "语音由服务器本机麦克风采集，网页麦克风不可用"
                           : "语音未开启（--no-audio 或语音模块启动失败），可以打字提问");
    }
    if (caps.voice_mode === "push_to_talk" && caps.audio_in_push) {
      enablePtt();
      tips.push("按住说话模式：按住“按住说话”按钮或空格键说话，松开后识别");
    }
    if (caps.audio_out_push) {
      connectAudio().catch(() => {});
      soundTip = "点击页面任意位置即可启用语音播报";
      document.addEventListener("pointerdown", unlockSound);
      document.addEventListener("keydown", unlockSound);
    }
  } catch (e) { tips.push("无法连接服务端"); }
  baseTips = tips; showTips();
  try { await listCameras(); } catch (e) {}
  connectChat();
})();
</script>
